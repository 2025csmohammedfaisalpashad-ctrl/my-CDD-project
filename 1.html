out:['Diagnose principal–agent problems and mitigations','Read incentive design (comp, ESOPs, promotion rules) as behavior prediction','Evaluate culture from artifacts, turnover, and candor','Assess board quality and related-party hygiene','Apply Grove’s leverage thinking to management'],
concepts:[
{t:'Agency problems',d:'Managers ≠ owners; the gap is filled by incentives, monitoring and culture — or by value leakage.'},
{t:'Skin in the game',d:'The cheapest governance mechanism: decision-makers who share the downside.'},
{t:'Goodhart’s law',d:'When a measure becomes the target it stops measuring; incentive-driven metrics get gamed.'},
{t:'Managerial leverage',d:'A manager’s output = the output of their organization × leverage of their activities.'},
{t:'Culture as coordination',d:'The set of behaviors rewarded and punished — read what gets promoted, not what gets printed.'},
{t:'Succession & founder risk',d:'The most underrated strategic risk in founder-led companies.'}],
models:['incentives','second','pa'],
books:['b36','b37','b26'],
res:['r1'],
ex:[{t:'Incentive autopsy',d:'Pick one listed company. Read the compensation/ESOP disclosures. Write: what behavior does this pay for, honestly?'},{t:'Culture read',d:'From the outside: Glassdoor patterns, attrition, insider selling, candidness in bad years. Triangulate the real culture of one firm.'},{t:'Board scorecard',d:'One company’s board: independence, attendance, related parties, committees. Grade governance A–F with evidence.'}],
cse:{title:'The metric that ate the company',brief:'Wells-Fargo-style cross-selling targets: the metric was hit; the franchise was poisoned. Trace the causal chain from incentive to behavior to scandal — and the three points where it was stoppable.'},
mist:['Reading vision statements instead of promotion patterns','Assuming aligned incentives because of a speech','Ignoring succession until it becomes a crisis'],
gate:{q:[
{q:'The principal–agent problem arises because…',o:['agents charge fees','those running a company (agents) may not share the full interests of its owners (principals)','principals are inactive','boards are illegal'],a:1,w:'Where ownership and control split, behavior follows the manager’s payoff unless incentives, monitoring or culture close the gap.'},
{t:'',q:'Goodhart’s law warns that…',o:['metrics are useless','when a measure becomes a target, people optimize the measure rather than the underlying reality','targets are illegal','measurement is optional'],a:1,w:'Every KPI is also a gaming surface. Design incentives expecting them to be attacked by clever employees.'},
{q:'A founder-CEO’s largest equity stake primarily helps governance by…',o:['making them richer','aligning their downside with shareholders — skin in the game','reducing taxes','simplifying audits'],a:1,w:'Shared downside is the oldest and cheapest form of alignment. Check the pledge status too — pledged skin is contingent skin.'}]}},

L21:{stage:'S6',code:'M-01',title:'Integrated Judgments — War Room',hours:40,prereq:['L13','L15','L17','L19'],
why:'The final examination is synthetic: ambiguous situations, incomplete data, real stakes. You must run the Owner Lens scenarios, survive the CEO Room, and defend a thesis before the Investment Committee.',
cap:'You can hold a position under adversarial questioning and update honestly when attacked.',
out:['Diagnose ambiguous business situations from partial data','Defend a thesis against a hostile committee','Concede specific points under pressure without collapsing','Update probabilities explicitly when attacked with evidence'],
concepts:[
{t:'Diagnostic reasoning',d:'From symptoms to mechanism: generate hypotheses, rank by likelihood, design the cheapest test.'},
{t:'Adversarial epistemology',d:'Your thesis only counts if it survives its strongest attacker — attack it yourself first.'},
{t:'Concession discipline',d:'Yield on points where the evidence is against you; double down only where your edge is real.'},
{t:'Synthesis under time pressure',d:'Executive summaries: decision, evidence, risks, kill condition — in five minutes.'}],
models:['inversion','base','ev','mrmarket'],

DATA.models=[
{id:'compounding',name:'Compounding',one:'Growth on growth: small rates, long times, absurd outcomes.',deep:'The most powerful force in wealth creation and the reason patience is a strategy. It applies to capital, reputation, knowledge and relationships — and punishes interruption.',q:['What in my life compounds if I simply do not interrupt it?','What am I doing that compounds negatively (debt, bad habits, distrust)?','Is my horizon long enough for compounding to matter?']},
{id:'oppcost',name:'Opportunity Cost',one:'Every yes is a thousand invisible nos.',deep:'The true cost of any choice is the best alternative you gave up. Capital, time and attention are all allocated against their next-best use — or wasted by default.',q:['What is the next-best use of this rupee/hour?','Have I compared this to my default (index return, sleep, doing nothing)?','Would I enter this position fresh today at this price?']},
{id:'coc',name:'Cost of Capital',one:'The hurdle every rupee must clear.',deep:'Capital is never free: providers require a return commensurate with risk. Any deployment below that hurdle destroys value regardless of how the story sounds.',q:['What must this capital earn to justify its risk?','Does this return beat the hurdle after tax and friction?','Who decides the hurdle — and are they using the right risk?']},
{id:'inversion',name:'Inversion',one:'Tell me where I’m going to die so I never go there.',deep:'Many problems are easier solved backwards: instead of asking how to win, ask how you would certainly lose — then systematically avoid those paths.',q:['How could this fail completely? List the mechanisms.','What would I do if I wanted to guarantee failure here?','Which single cause of death can I remove cheapest?']},
{id:'mos',name:'Margin of Safety',one:'Build the bridge for 3× the load you expect.',deep:'Because analysis is uncertain and futures are distributions, the professional buys only when the price is far below conservative value. The margin absorbs being wrong.',q:['What is my value estimate, and how far is price below it?','What happens if my key assumption is 30% wrong?','Does the downside scenario still leave me solvent?']},
{id:'mrmarket',name:'Mr. Market',one:'The market is there to serve you prices, not opinions.',deep:'Daily prices reflect a manic-depressed auctioneer’s mood. Your job is to exploit the moods, not adopt them; the market exists to be used, not obeyed.',q:['Am I treating price as information or as instruction?','Would I buy more at this price, or only feel relieved selling?','What has changed — the business or the mood?']},
{id:'moat',name:'Moat & Durability',one:'Every excess return attracts an army; the moat is what stops it.',deep:'Competitive advantage is a decaying asset. Classify the moat (scale, network, switching, brand, regulation, cost), evidence it with pricing power and ROIC, and date its expiry.',q:['What evidence of pricing power exists in the numbers?','Who is the most dangerous attacker and what is their plan?','What does this moat look like in ten years?']},
{id:'incentives',name:'Incentive Structures',one:'Show me the incentive and I will show you the outcome.',deep:'Behavior follows payoffs — financial, reputational, positional. Predict people by their incentive environment rather than their statements, and audit your own theses for the incentive behind them.',q:['Who benefits if I believe this?','What does the compensation structure pay people to do?','What would I do if I were paid like them?']},
{id:'second',name:'Second-Order Effects',one:'And then what? And then what after that?',deep:'Most analysis stops at the obvious first consequence. Advantage lives in tracing the chain: competitors’ responses, regulatory reactions, behavior changes, feedback loops.',q:['What happens next, after the obvious effect?','Who responds, and how does their response change my outcome?','Does this create a feedback loop or a one-time event?']},
{id:'base',name:'Base Rates',one:'Before your story, what usually happens?',deep:'The outside view: historical frequencies for this class of events. Most ventures fail, most turnarounds fail, most M&A destroys value. Anchor on the base rate; your story must earn the deviation.',q:['What is the historical success rate for this kind of bet?','What is my evidence that I am the exception?','Am I inside-viewing a base-rate event?']},
{id:'ev',name:'Expected Value',one:'Decisions are probability-weighted payoffs, not predictions.',deep:'Multiply each outcome by its probability and sum. Positive-EV decisions can still lose; negative-EV decisions can still win. Judge process, not single outcomes — and size accordingly.',q:['What are the outcomes, probabilities and payoffs?','Is this bet repeatable, or one-shot?','What sizing makes ruin impossible even in the bad branch?']},
{id:'prob',name:'Probabilistic Thinking',one:'Think in distributions, not destinies.',deep:'The future is a cloud of scenarios with weights. Forecasters who calibrate (70% things happen ~70% of the time) compound better decisions than confident storytellers.',q:['What is my probability, stated as a number?','What evidence would move it, and by how much?','How calibrated were my last ten stated probabilities?']},
{id:'pa',name:'Principal–Agent',one:'Whose money, whose downside?',deep:'Whenever one person decides with another’s money, interests diverge unless incentives, monitoring or culture close the gap. Look for skin in the game before trust.',q:['Whose capital is at risk in this decision?','What does the agent gain regardless of my outcome?','Where is the skin in the game — and is it pledged?']},
{id:'scale',name:'Scale Economics',one:'Fixed costs divided by rising volume is the oldest advantage in business.',deep:'Unit costs fall as volume rises — until complexity, diseconomies or regulation reverse it. Scale advantages compound best when paired with retention and pricing power.',q:['What share of costs are fixed, and how do they spread?','Does scale help the customer or only the producer?','At what size do diseconomies begin here?']},
{id:'meanrev',name:'Mean Reversion & Cycles',one:'Exceptional returns attract the competition that ends them.',deep:'High profits invite capacity; fear creates bargains. Both corporate performance and market sentiment swing around averages — extremes carry the seeds of their reversal.',q:['Where are we in the cycle, and what does the base case assume?','Is current performance sustainable or an outlier pulling back?','What would a 5-year average look like versus this year?']}
];

/* ------------------------------ SCENARIOS --------------------------- */
DATA.scen=[
{id:'sc1',title:'Growth with shrinking margins',setup:'A listed consumer company reports revenue up 30% YoY. Gross margin has fallen from 42% to 36% over four quarters. Management calls it “temporary investment for growth.” The stock is up 15% on the revenue number.',
prompt:'What exactly do you investigate, in what order, and what would change your view from “fine” to “dangerous”?',
breakdown:['Decompose the margin move: input costs vs price realisation vs product/geography mix. Segment disclosure is the first stop.','Ask who funded the growth: was it discounting or channel loading? Check receivable days and inventory days — growth bought with working capital shows up there first.','Compute incremental margin on the new revenue. If each new rupee of revenue earns less than the cost of capital, growth is destroying value — the opposite of the headline.','Benchmark against competitors: if their margins held, the problem is company-specific (bad sign); if everyone’s fell, it is industry-wide input pressure (watch pass-through power).','“Temporary” must be falsifiable: define the metric and the quarter by which margin should recover, or the explanation is narrative.']},
{id:'sc2',title:'Profit without cash',setup:'Net income has grown five straight years. Operating cash flow was negative last year and is flat this year. CFO/NI over five years averages 0.55. The CEO highlights “record profits.”',
prompt:'Where is the profit hiding, and what single disclosure would you read first?',
breakdown:['The gap is accruals: check receivables growth vs revenue growth (channel stuffing indicator), and inventory build vs sales growth (demand indicator).','Read the revenue-recognition note and any accounting-policy changes. Also any sudden increase in “other income” or one-time gains dressing operating profit.','Check for capitalised costs: expenses moved to the balance sheet flatter the P&L today and load the future.','Look at the auditor’s report and related-party disclosures; auditor changes during such a pattern deserve a discount.','The rule: over time CFO must converge to NI. A business cannot distribute accruals to shareholders — only cash.']},
{id:'sc3',title:'The price war',setup:'Your main competitor cuts prices 20% across the category. Their revenue is 40% of yours; their burn runway is reportedly 18 months. Your sales team is panicking and asking for discount authority.',
prompt:'Do you match, hold, or respond differently? What analysis decides it?',
breakdown:['Diagnose the attacker: is this desperation (cash need, investor pressure) or a structural cost advantage? The response differs completely.','Segment your customers by price sensitivity. For the inelastic loyal base, matching is pure margin donation. Hold price there and reinforce value (service, terms, bundling).','If needed, make a targeted defensive offer only for the genuinely price-sensitive segment — a scalpel, not a blanket cut.','Model the second order: a blanket price war resets category price expectations for years. Calculate the NPV of the price umbrella you’d be destroying.','Set a tripwire: if their share rises X points over two quarters or your retention falls Y%, escalate. Decide the trigger now, not under fire.']},
{id:'sc4',title:'The big acquisition',setup:'The CEO announces acquisition of a private competitor for ₹4,000 crore — 8× the target’s revenue, 35× EBITDA — funded with debt and equity. Slide deck says “20% cost synergies by year two.” The stock falls 6% on the news.',
prompt:'What questions do you ask, and what base rate governs your priors?',
breakdown:['Base rate first: the majority of large acquisitions fail to earn their cost of capital. The burden of proof is on this deal, not against it.','Price check: 35× EBITDA means you are paying for flawless growth. What does the target’s own quality of earnings look like (private-company numbers deserve extra skepticism)?','Synergy realism: cost synergies are at least plausible; demand the line items. “Revenue synergies” are usually narrative. Who exactly leaves their job to make synergies happen?','Incentives: is management compensated on size/EBITDA (empire-building risk)? What did their last three acquisitions deliver per share?','The market fell 6%: the market is a weighing machine on deals. Write your own per-share accretion/dilution at base case, then decide if management’s optimism is worth 4,000 crores of your trust.']},
{id:'sc5',title:'The hypergrowth burner',setup:'A startup grows revenue 3× YoY to ₹300 crore, burns ₹600 crore/year, has two customers making 60% of revenue, and is raising at a ₹6,000 crore valuation. Founders call it “blitzscaling.”',
prompt:'What is the most dangerous assumption, and what numbers would you demand?',
breakdown:['Revenue quality: concentration at 60% means this is effectively two client relationships with a logo wall. What are the contracts, renewals and bargaining dynamics?','Gross margin trajectory: if contribution margin per unit is negative, scale is accelerating destruction. Get cohort-level economics, not blended.','Burn multiple (burn ÷ net new revenue) and runway: how many raises to profitability at current slope, and what happens in a funding winter?','Valuation sanity: at ₹6,000 crore, what terminal revenue and margin must be true? Work backwards and judge the probability of that world.','Founder incentives and dilution path: who owns the upside after this round, and what do liquidation preferences do to common holders? Blitzscaling is a strategy; it is not an excuse to skip arithmetic.']},
{id:'sc6',title:'The dividend cut',setup:'A retailer with 400 stores reports flat same-store sales for eight quarters while online revenue grows 50% from a tiny base. Yesterday it cut the dividend 60% “to fund transformation.” The stock yields 9% on the old dividend.',
prompt:'Value trap or turnaround? What separates the two?',
breakdown:['The dividend cut is information: management is telling you internal cash generation cannot fund both distributions and the required change. Believe cash before words.','Four-wall economics: what does a healthy store contribute after rent and staff? If the fleet is half healthy and half bleeding, the plan must close stores — does it?','Balance sheet stress: debt maturities, lease obligations, inventory turns. A 9% yield after a cut is usually the market pricing distress, not generosity.','The transformation math: what does online need to reach to replace store EBITDA, at what capex, in what timeframe? Compare against competitors’ online conversion rates.','Verdict framework: turnarounds worth owning have asset coverage, a credible cash bridge, and management with prior turnaround scars. Everything else is a falling knife with a coupon.']}
];

/* ------------------------------- CEO SIMS --------------------------- */
DATA.ceo=[
{id:'ceo1',title:'The pricing decision',context:'Your B2B software company: ₹120 crore ARR, growing 35%, net revenue retention 118%, monthly churn 1.4%. Prices unchanged for three years. A well-run competitor charges ~30% more. Sales says customers are happy; finance wants margin. You have one pricing move this year.',
opts:[
{label:'Raise list price 15% for new customers only; existing customers grandfathered for 12 months',q:'strong',fb:'The strongest option: you test willingness-to-pay where information is cheapest (new deals) and protect retention while giving a documented upgrade path. Watch win-rate and sales-cycle data for two quarters; if loss rates stay flat, you have proven pricing power and can extend.'},
{label:'Raise 15% across the board immediately',q:'ok',fb:'Directionally right — NRR 118% and a pricier competitor are evidence of underpricing. But an immediate blanket raise risks a churn spike you cannot un-ring, and it burns goodwill you may need in a downturn. Grandfathering or notice periods convert the same economics with less tail risk.'},
{label:'Hold prices; grow share with the current advantage',q:'weak',fb:'This is leaving the most certain money on the table. Pricing is the highest-leverage line in the business: a 10% price increase at your margins is worth more than most growth initiatives. “Customers are happy” is precisely the signal that prices are too low.'},
{label:'Introduce a usage-based pricing pilot on 10% of new deals',q:'ok',fb:'A legitimate experiment and usage models can align price with value — but it adds billing complexity and the pilot is too small to move the P&L this year. Experiments are best when they are designed to decide something; pre-commit the decision rule.'}
],lesson:'Pricing is evidence work. Retention above 100% and a pricier competitor are quantitative evidence of unused pricing power. Move deliberately, instrument everything, and pre-commit the decision rule before the data arrives.'},
{id:'ceo2',title:'The acquisition on the table',context:'An adjacent-market target, founder-led, ₹200 crore revenue, 12% EBITDA margins, growing 20%. Asking: 9× EBITDA. A private-equity bidder is circling. Integration would stretch your management team for 18 months. Your board asks for your recommendation in 48 hours.',
opts:[
{label:'Bid aggressively at 9× to win before PE does',q:'weak',fb:'Auction heat is the most expensive emotion in corporate finance. The base rate for acquisitions at rich multiples is poor, and “we might lose it” is not a thesis. Winners of contested auctions frequently pay for the privilege of owning someone else’s problems.'},
{label:'Decline entirely; focus on organic growth',q:'ok',fb:'Defensible — most acquisitions fail, and your management bandwidth is a real constraint. But walking away without a price is also a failure to do your job: there exists a price at which this is clearly accretive. Discipline means knowing that number, not refusing to compute it.'},
{label:'Offer 6.5× EBITDA with a structured earn-out tied to two-year growth, key-person retention, and walk-away terms',q:'strong',fb:'This is the professional answer: a price where the arithmetic works at base case (not synergy case), structure that makes the founder share integration risk, and retention that buys the knowledge you are actually purchasing. If they refuse, the deal was never yours at a sane price.'},
{label:'Propose a distribution partnership first, with an option to acquire in 24 months',q:'ok',fb:'A thoughtful real option: learn the business cheaply before buying it. But the option has a cost (you may build their value for PE), and in 24 months you will pay for the growth you helped create. Use it if information asymmetry is the dominant risk.'}
],lesson:'The three disciplines of M&A: a walk-away price computed before emotion, structure that shares risk, and honesty about integration capacity. The best acquirers say no to almost everything — which is precisely why their yeses work.'},
{id:'ceo3',title:'Seven weeks of cash',context:'Cash runway: 7 weeks. Receivables have stretched to 95 days (industry norm 45). The bank line is fully drawn. Your biggest customer (25% of revenue) pays slow but loves the product. A venture firm offers an emergency round at half your last valuation.',
opts:[
{label:'Take the emergency equity immediately — survival first, dilution second',q:'ok',fb:'Survival is genuinely the prerequisite for everything else, and this cannot be dismissed. But taking the worst-priced money before exhausting cash levers is sequencing error: every week of improved collection strengthens your negotiating position. Secure the term sheet as a fallback, then squeeze the cash cycle hard.'},
{label:'Launch an all-out cash conversion campaign: early-pay discounts for big customers, collections blitz on the top-20 debtors, freeze every non-critical spend, and tell the team the truth',q:'strong',fb:'This is the answer. The 50-day receivable gap versus norm is probably more cash than the equity raise is worth at half valuation. Discounts for prepayment are cheap compared to 50% dilution. Candor with the team converts anxiety into execution. Keep the VC offer warm as the backstop.'},
{label:'Bet on landing one large pending contract; pause other actions to focus everyone on it',q:'weak',fb:'Hope is not a strategy and concentration on a single binary outcome while the clock runs is how companies die with great stories. Work the deal — but never let the company’s oxygen depend on one signature that is not yours.'},
{label:'Cut headcount 30% immediately to extend runway',q:'ok',fb:'Cost cuts buy time but they also break momentum, and in a services/software business the people are often the product. If collections fail, cuts become necessary — but they are the second lever, not the first, and severance itself consumes cash you do not have.'}
],lesson:'Cash crises are solved in the working-capital cycle first. The order of operations: convert receivables, renegotiate payables, freeze spend, then raise — ideally with the raise as backstop rather than last resort.'},
{id:'ceo4',title:'The poaching raid',context:'Your best engineer — architect of your core product line — has an offer at +40% compensation from a funded competitor, who is also courting three of her team. Your comp bands are two years stale. HR says counter-offers “usually don’t work long term.” Ship dates are in six weeks.',
opts:[
{label:'Match +40% for her and the three, quietly',q:'weak',fb:'You would retain four people this quarter and teach the entire company that loyalty is priced by outside offers. The next raid (and there will be one) will cost even more. Counter-offers also rarely survive: the reasons people leave rarely dissolve with money.'},
{label:'Let her go; promote from within and absorb the schedule risk',q:'weak',fb:'Stoic, but this is the most expensive option on the table: six weeks to ship, irreplaceable architecture knowledge, and a signal to every ambitious person that the ceiling here is the market’s floor. Sometimes right — after you have actually fought for the person.'},
{label:'Have the honest conversation: counter with a real package (meaningful equity, expanded scope, title), fix the stale comp bands company-wide this month, and build a succession plan for her role regardless of the answer',q:'strong',fb:'This attacks the problem at all three time horizons: the person (genuine growth, not just money), the system (comp bands are the root cause — two years stale means everyone is under-market), and the risk (succession planning is prudent whether she stays or goes). Retention is structural, not transactional.'},
{label:'Threaten legal action on IP and non-compete clauses',q:'weak',fb:'Legal warfare against departing talent poisons the culture you are trying to protect, rarely works cleanly, and makes every remaining employee update their resume. Reserve lawyers for genuine theft, not for losing an auction you refused to price honestly.'}
],lesson:'Retention failures are almost always system failures wearing individual costumes. Fix the person with honesty, fix the system with updated bands, and fix the risk with succession — in that order, all at once.'}
];

/* --------------------------- COMMITTEE QUESTIONS -------------------- */
DATA.commQ=['Summarise the business in one paragraph a smart 12-year-old would understand. If you cannot, you do not own this thesis.','Who is the marginal buyer of this stock today, and why are they wrong?','Show the moat in numbers — pricing power, retention, ROIC durability — not adjectives.','What has management’s incremental ROIC been over five years, and why should we trust the next rupee to them?','Which single assumption drives more than half your valuation? What is the evidence for it?','What is the base rate for companies like this achieving what you project?','Deliver the bear case as if you were short the stock. Seriously.','Quantify the downside: percentage and absolute. Can your portfolio — and your psychology — survive it?','What is the opportunity cost versus your second-best idea, stated honestly?','What incentive does management have to mislead you, and where is their skin in the game?','What specifically would kill this thesis, and what is the earliest observable indicator?','Why now? If it is so obvious, why hasn’t the market priced it — and what do you know or believe that it doesn’t?','Separate the two questions: is this a good company, and is it a good investment at this price?','What would make you sell? Name the trigger before you need it.'];

/* ------------------------------ DRILLS ------------------------------ */
DATA.drills={
be:{name:'Break-Even Engine',why:'Survival arithmetic: how many units must sell before fixed costs are covered. Every business plan and every pricing decision starts here.',
fields:[['fc','Fixed costs per month (₹)',300000],['p','Price per unit (₹)',500],['v','Variable cost per unit (₹)',200]],
calc:i=>{const c=i.p-i.v;const be=c>0?i.fc/c:null;return be==null?'Price must exceed variable cost — otherwise every unit loses money.':['Break-even volume: '+n0(Math.ceil(be))+' units / month','Break-even revenue: ₹'+n0(Math.ceil(be)*i.p),'Contribution margin per unit: ₹'+n0(c)+' ('+pct(c/i.p)+' of price)','Each unit beyond break-even adds ₹'+n0(c)+' straight to profit.']},
hint:'Raise price or cut variable cost and watch break-even fall — contribution margin is the lever.'},
ltv:{name:'Unit Economics — LTV / CAC',why:'The heartbeat of any subscription or repeat-purchase business: does a customer return more than they cost to acquire?',
fields:[['arpu','Avg monthly revenue per customer (₹)',1200],['gm','Gross margin (%)',70],['life','Avg customer life (months)',24],['cac','Customer acquisition cost (₹)',2400]],
calc:i=>{const ltv=i.arpu*(i.gm/100)*i.life;const r=i.cac>0?ltv/i.cac:null;const pb=i.arpu*(i.gm/100)>0?i.cac/(i.arpu*(i.gm/100)):null;return['LTV: ₹'+n0(ltv),'LTV : CAC = '+(r==null?'—':r.toFixed(1)+'×  '+(r>=3?'(healthy)':r>=1?'(thin — improve retention or CAC)':'(broken — you lose money on every customer)')),'CAC payback: '+(pb==null?'—':pb.toFixed(1)+' months'),'Rule of thumb: LTV/CAC ≥ 3 and payback under ~18 months for venture-grade businesses.']},
hint:'Retention is compounding: doubling customer life doubles LTV without touching acquisition.'},
npv:{name:'NPV & IRR',why:'The decision rule of corporate finance: does this stream of cash, discounted at its risk, exceed its cost? Enter cash flows comma-separated, t=0 first (negative for investment).',
fields:[['cfs','Cash flows, comma-separated (₹, t0 first)','-100000, 30000, 40000, 50000, 30000'],['r','Discount rate (%)',12]],
calc:i=>{const cfs=String(i.cfs).split(',').map(x=>parseFloat(x)).filter(isFinite);if(cfs.length<2)return 'Enter at least two cash flows.';let npv=0;cfs.forEach((c,t)=>npv+=c/Math.pow(1+i.r/100,t));const ir=irr(cfs);return['NPV at '+i.r+'%: ₹'+n0(npv)+'  →  '+(npv>0?'create value (accept if this is the best use of capital)':'destroys value at this hurdle')+(npv>0?'':''),'IRR: '+(ir==null?'no clean IRR (check cash-flow signs)':(ir*100).toFixed(1)+'%  vs hurdle '+i.r+'%'),'Warning: IRR assumes reinvestment at IRR and can mislead on scale — NPV is the verdict.']},
hint:'Change the discount rate until NPV ≈ 0 — that is the IRR, found by hand.'},
wacc:{name:'Cost of Capital (WACC)',why:'The hurdle every deployment must clear. Built from the equity risk premium, the firm’s beta, and the after-tax cost of debt.',
fields:[['e','Market cap / equity value (₹ cr)',5000],['d','Debt (₹ cr)',1500],['rf','Risk-free rate (%)',7],['beta','Beta',1.1],['erp','Equity risk premium (%)',6],['rd','Cost of debt (%)',9],['tax','Tax rate (%)',25]],
calc:i=>{const re=i.rf+i.beta*i.erp;const V=i.e+i.d;const w=(i.e/V)*re+(i.d/V)*i.rd*(1-i.tax/100);return['Cost of equity (CAPM): '+re.toFixed(2)+'%','After-tax cost of debt: '+(i.rd*(1-i.tax/100)).toFixed(2)+'%','Weights: equity '+pct(i.e/V)+' / debt '+pct(i.d/V),'WACC: '+w.toFixed(2)+'% — this is the hurdle the next rupee must beat.']},
hint:'Higher beta → higher cost of equity → higher hurdle. Risk sets the price of capital.'},
dcf:{name:'Two-Stage DCF',why:'The core intrinsic-value machine: explicit growth years, then a terminal perpetuity — discounted at risk, divided into shares.',
fields:[['fcf0','Last year’s FCF (₹ cr)',400],['g1','Growth stage rate (%/yr)',12],['n','Growth years',7],['gT','Terminal growth (%)',4],['w','WACC (%)',11],['nd','Net debt (₹ cr; cash negative)',800],['sh','Shares outstanding (cr)',50]],
calc:i=>{if(i.w<=i.gT)return 'WACC must exceed terminal growth, or the perpetuity explodes.';let pv=0,fcf=i.fcf0;for(let t=1;t<=i.n;t++){fcf=fcf*(1+i.g1/100);pv+=fcf/Math.pow(1+i.w/100,t);}const tv=fcf*(1+i.gT/100)/(i.w/100-i.gT/100);const pvtv=tv/Math.pow(1+i.w/100,i.n);const ev=pv+pvtv;const eq=ev-i.nd;const ps=eq/i.sh;return['PV of growth stage: ₹'+n0(pv)+' cr','Terminal value (undiscounted): ₹'+n0(tv)+' cr  →  PV ₹'+n0(pvtv)+' cr ('+pct(pvtv/(pv+pvtv))+' of enterprise value!)','Enterprise value: ₹'+n0(ev)+' cr','Equity value: ₹'+n0(eq)+' cr','Intrinsic value per share: ₹'+n0(ps),'Notice: the terminal assumption carries the majority of the answer. Handle it accordingly.']},
hint:'Move WACC and terminal growth ±1% and watch per-share value swing — this is why professionals argue about those two numbers.'},
rev:{name:'Reverse DCF — What Does the Market Believe?',why:'The most underused question in investing: instead of forecasting growth, extract the growth the current price already assumes. Then judge if that belief is sane.',
fields:[['mcap','Current market cap (₹ cr)',9000],['nd','Net debt (₹ cr)',800],['fcf0','Last year’s FCF (₹ cr)',400],['n','Explicit years',7],['gT','Terminal growth (%)',4],['w','Discount rate (%)',11]],
calc:i=>{if(i.w<=i.gT)return 'Discount rate must exceed terminal growth.';const target=i.mcap+i.nd;const evFor=g=>{let pv=0,fcf=i.fcf0;for(let t=1;t<=i.n;t++){fcf=fcf*(1+g);pv+=fcf/Math.pow(1+i.w/100,t);}const tv=fcf*(1+i.gT/100)/(i.w/100-i.gT/100);return pv+tv/Math.pow(1+i.w/100,i.n);};let lo=-0.3,hi=0.6;for(let k=0;k<80;k++){const m=(lo+hi)/2;evFor(m)<target?lo=m:hi=m;}const g=(lo+hi)/2;return['Target enterprise value: ₹'+n0(target)+' cr','Implied FCF growth for '+i.n+' years: '+(g*100).toFixed(1)+'% per year','Now the real work: is '+(g*100).toFixed(1)+'% growth believable for this business for '+i.n+' years? If yes, the price is fair-to-cheap. If not, the market is paying for a story.']},
hint:'If the implied growth exceeds the industry’s history, you are not buying a business — you are buying a miracle.'},
proj:{name:'3-Year FCF Projector',why:'The miniature three-statement engine: from revenue growth and margins to free cash flow — the drill that teaches you why growth can consume cash.',
fields:[['rev0','Revenue this year (₹ cr)',1000],['g','Revenue growth (%/yr)',20],['em','EBITDA margin (%)',18],['da','D&A (% of revenue)',4],['tax','Tax rate (%)',25],['cx','Capex (% of revenue)',6],['wc','Working capital (% of revenue increase)',15]],
calc:i=>{let rev=i.rev0,rows=['Year | Revenue | EBITDA | NOPAT | FCF','----|---------|--------|-------|----'];for(let y=1;y<=3;y++){const nrev=rev*(1+i.g/100);const ebitda=nrev*i.em/100;const da=nrev*i.da/100;const ebit=ebitda-da;const nopat=ebit*(1-i.tax/100);const fcf=nopat+da-nrev*i.cx/100-(nrev-rev)*i.wc/100;rows.push('Y'+y+' | ₹'+n0(nrev)+' cr | ₹'+n0(ebitda)+' cr | ₹'+n0(nopat)+' cr | ₹'+n0(fcf)+' cr');rev=nrev;}rows.push('If FCF lags profit badly, growth is eating working capital and capex — the classic “profitable but cashless” trap.');return rows},
hint:'Drop growth to 5% and watch FCF jump — sometimes slower growth is richer growth.'},
bb:{name:'The Buyback Value Test',why:'Buybacks are praised by press release and mispriced by executives. The arithmetic is brutal: buy below intrinsic value and stayers gain; above it and wealth transfers to exiting holders.',
fields:[['sh','Shares outstanding (cr)',10],['v','Intrinsic value per share (₹)',1000],['p','Buyback price (₹)',800],['c','Cash spent on buyback (₹ cr)',2000]],
calc:i=>{if(i.p<=0||i.sh<=0)return 'Enter positive share count and price.';const bought=i.c/i.p;if(bought>=i.sh)return 'You cannot buy back more shares than exist.';const nv=(i.v*i.sh-i.c)/(i.sh-bought);const d=(nv-i.v)/i.v;return['Shares repurchased: '+bought.toFixed(2)+' cr','Per-share value after buyback: ₹'+n0(nv)+' (was ₹'+n0(i.v)+')','Change for continuing shareholders: '+(d>=0?'+':'')+(d*100).toFixed(2)+'%','Verdict: '+(i.p<i.v?'buying below value — the buyback creates wealth for stayers':'buying above value — stayers subsidise the exiting holders')+'. EPS rising proves nothing; per-share intrinsic value is the only scoreboard.']},
hint:'Run it at a price above intrinsic value and watch stayers get poorer while EPS “improves.”'}
};

function lvState(id){return S.levels[id]||{};}
function isMastered(id){const s=S.levels[id];return !!(s&&s.st==='done');}
function unlocked(id){return DATA.levels[id].prereq.every(p=>isMastered(p));}
function statusOf(id){const s=S.levels[id];if(s&&s.st==='done')return 'done';if(!unlocked(id))return 'locked';if(s&&(s.attempts>0||Object.keys(s.att||{}).length))return 'in';return 'open';}
const STATUS={done:['Mastered','st-done'],in:['In progress','st-in'],open:['Available','st-open'],locked:['Locked','st-locked']};
function currentLevel(){return ORDER.find(id=>!isMastered(id))||null;}
function masteredCount(){return ORDER.filter(isMastered).length;}
function artifactsOk(){return S.memos.length>=1&&S.companies.some(c=>c.val&&c.val.fcf0!==''&&c.val.wacc!=='')&&S.ideas.length>=1;}
function tryMaster(id){const lv=DATA.levels[id],st=S.levels[id];if(!st||!st.last||st.st==='done')return;
 if(st.last.score<st.last.total)return;
 const need=lv.out.length,got=Object.values(st.att||{}).filter(Boolean).length;if(got<need)return;
 if(lv.extra==='artifacts'&&!artifactsOk()){toast('Capstone requires: 1 memo + 1 valued company analysis + 1 analyzed idea.');return;}
 if(lv.extra==='committee'&&S.committee.length<1){toast('Complete at least one Investment Committee defense first.');return;}
 st.st='done';st.masteredAt=Date.now();save();log('Mastered',lv.code+' '+lv.title);toast('MASTERED — '+lv.code+' '+lv.title+'. Next level unlocked.');route();}
function gradeQuiz(id){const lv=DATA.levels[id],qs=lv.gate.q;let score=0;
 for(let i=0;i<qs.length;i++){const sel=document.querySelector('input[name="'+id+'q'+i+'"]:checked');if(!sel){toast('Answer every question before submitting the gate.');return;}}
 for(let i=0;i<qs.length;i++){const v=+document.querySelector('input[name="'+id+'q'+i+'"]:checked').value;if(v===qs[i].a)score++;}
 const st=S.levels[id]||(S.levels[id]={att:{}});st.attempts=(st.attempts||0)+1;st.last={score,total:qs.length,ts:Date.now()};if(st.st!=='done')st.st='in';
 save();log('Gate attempt',lv.code+' — '+score+'/'+qs.length);tryMaster(id);route();}
function attChk(id,i,el){const st=S.levels[id]||(S.levels[id]={att:{}});st.att=st.att||{};st.att[i]=el.checked;save();tryMaster(id);}
function skills(){const qs=Object.values(S.levels).filter(l=>l.last);
 const know=qs.length?Math.round(qs.reduce((a,l)=>a+l.last.score/l.last.total*100,0)/qs.length):0;
 return[['Knowledge',know],['Analysis',Math.min(100,S.companies.length*20+S.memos.length*15)],['Modeling',Math.round(Object.keys(S.calc).length/Object.keys(DATA.drills).length*100)],['Judgment',Math.min(100,S.decisions.length*8+S.mistakes.length*8+S.committee.length*15)],['Building',Math.min(100,S.ideas.length*25+Object.values(S.scen).filter(s=>s&&s.revealed).length*8+Object.keys(S.ceo).length*10)],['Discipline',Math.min(100,S.notes.length*5+missionDone()*2+Object.keys(S.resDone).length*3)]];}
function genMissions(){const today=new Date().toDateString();if(S.missions&&S.missions.date===today)return;
 const pool=[];const cur=currentLevel();
 if(cur&&!isMastered(cur))pool.push({t:'Clear the Mastery Gate for '+DATA.levels[cur].code+' '+DATA.levels[cur].title,k:'gate'});
 if(S.companies.length<3)pool.push({t:'Run one structured analysis in the Company Lab (primary filings only)',k:'co'});
 const mm=DATA.models[dayNum()%DATA.models.length];pool.push({t:'Study the mental model “'+mm.name+'” and write one line of application in Notes',k:'mm'});
 if(cur){const b0=DATA.levels[cur].books[0];if(b0&&DATA.books[b0])pool.push({t:'Read 25 minutes: '+DATA.books[b0].t,k:'read'});}
 const drills=Object.keys(DATA.drills).filter(d=>!S.calc[d]);if(drills.length)pool.push({t:'Complete modeling drill: '+DATA.drills[drills[0]].name,k:'drill'});
 const old=S.mistakes.find(m=>Date.now()-m.t>7*864e5);if(old)pool.push({t:'Revisit your mistake “'+old.decision.slice(0,40)+'” — has the lesson held?',k:'mist'});
 if(!S.decisions.length)pool.push({t:'Log your first real decision in the Decision Journal',k:'dec'});
 S.missions={date:today,items:pool.slice(0,5).map(p=>({...p,done:false}))};save();}
function missionDone(){return S.missions&&S.missions.items?S.missions.items.filter(m=>m.done).length:0;}
function missionToggle(i){if(S.missions&&S.missions.items[i]!==undefined){S.missions.items[i].done=!S.missions.items[i].done;save();route();}}

 h+=sec('When macro matters — and when it doesn’t','Principles','<ul style="padding-left:20px;color:var(--dim)"><li style="margin-bottom:8px">Macro matters most for: financials, capital-intensive cyclicals, heavily indebted firms, and your own asset allocation.</li><li style="margin-bottom:8px">Fundamentals matter more for: durable consumer franchises, high-ROIC compounders, and anything whose cash flows you can underwrite directly.</li><li style="margin-bottom:8px">Nobody consistently forecasts macro well; position for ranges, not points. Write the macro memo quarterly and diff it against your past self.</li></ul>');
 h+=sec('Instrument panel','Primary sources only','<div class="card">'+ln('r9','U.S. series: rates, inflation, credit')+ln('r10','Indian policy, credit, yields')+ln('r20','Global growth/inflation baseline')+ln('r17','The 30-minute credit-cycle mental model')+ln('r18','Long-run development data')+ln('r19','Secular trend data')+'</div>');
 h+=sec('Standing exercise','The quarterly macro memo','<div class="card" style="border-left:3px solid var(--neon)">Once a quarter, write one page: what changed in rates, inflation, credit, and your sectors; what it implies for your analyses; <em>and what you will not change because of it.</em> <button class="btn sm" style="margin-top:10px" onclick="macroNote()">Draft template in Notes</button></div>');
 return h;}
function macroNote(){S.notes.unshift({id:uid(),t:Date.now(),tag:'macro-memo',body:'QUARTERLY MACRO MEMO — '+new Date().toLocaleDateString()+'\n\nRates & policy stance:\nInflation:\nCredit & liquidity:\nMy sectors’ cycle position:\nImplications for my analyses:\nWhat I will NOT change because of this:'});save();log('Macro memo drafted','quarterly template');location.hash='#/notes';}

/* ------------------------------- ABOUT ------------------------------ */
function vAbout(){return '<div class="hero"><div class="kicker">Philosophy</div><h1 class="big">Why this system exists</h1><p class="lead">One operating loop, repeated for years:</p></div><blockquote>Learn → Understand → Apply → Analyze → Decide → Build → Measure → Reflect → Advance<span class="attr">the COMPOUNDER loop — optimizing for judgment, not completion</span></blockquote>'
 +sec('The canon','Questions this system trains you to answer about any company','<div class="grid g2">'+['What exactly does this business do, and why does it exist?','Who pays it, and why do they choose it?','What are the unit economics, and what creates the advantage?','How durable is the advantage — and what could destroy it?','How good is management’s capital allocation, per rupee retained?','What does the balance sheet and cash flow confess?','What is it worth, and on what assumptions?','What does the market believe — where could it be wrong?','What would make me change my mind?','Would I want to own the entire company?','If I were CEO, what would I change? If a competitor, how would I attack?','What happens under optimistic, base, and catastrophic scenarios?'].map(q=>'<div class="listline">◦ '+q+'</div>').join('')+'</div>')
 +sec('The anti-curriculum','What most students waste time on','<ul style="padding-left:20px;color:var(--dim)"><li style="margin-bottom:6px">Memorizing jargon instead of reading primary documents.</li><li style="margin-bottom:6px">Chart-reading and tip-chasing before understanding what a business is.</li><li style="margin-bottom:6px">Valuation formulas before accounting and unit economics.</li><li style="margin-bottom:6px">Strategy vocabulary before competitive arithmetic.</li><li style="margin-bottom:6px">Macro prediction theater before company fundamentals.</li></ul>')
 +sec('Data & durability','Your progress lives in this browser','<div class="card"><p class="dim" style="font-size:13.5px;margin-bottom:12px">Everything — progress, notes, memos, analyses, journals — persists in localStorage on this machine. Export regularly; this is your intellectual ledger.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="exportData()">Export backup (JSON)</button><label class="btn" style="cursor:pointer">Import backup<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label><button class="btn danger" onclick="resetAll()">Factory reset</button></div></div>')
 +sec('Responsible finance','Read once, remember always','<div class="card" style="border-left:3px solid var(--amber)"><p style="font-size:13.5px;color:var(--dim)">This platform teaches financial and business analysis. It does not guarantee investment returns and does not constitute personalized financial advice. Markets can decline permanently for any participant. Study risk before reward; size positions so that being wrong is survivable.</p></div>');}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='compounder-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup downloaded.');}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.levels||!d.notes){toast('Not a valid COMPOUNDER backup.');return;}S=Object.assign(defState(),d);save();toast('Backup restored.');route();}catch(e){toast('Could not parse file.');}};r.readAsText(f);}
function resetAll(){if(!confirm('Erase ALL progress, notes, memos and journals? This cannot be undone.'))return;if(!confirm('Final confirmation — factory reset?'))return;localStorage.removeItem(KEY);location.reload();}

/* ------------------------------- SEARCH ----------------------------- */
function vSearch(q){q=(q||'').toLowerCase();const R=[];
 if(q){ORDER.forEach(id=>{const l=DATA.levels[id];if((l.title+' '+l.cap+' '+l.concepts.map(c=>c.t+' '+c.d).join(' ')).toLowerCase().includes(q))R.push(['Level',l.code+' — '+l.title,'#/level/'+id]);});
  Object.entries(DATA.books).forEach(([id,b])=>{if((b.t+' '+b.a+' '+b.why).toLowerCase().includes(q))R.push(['Book',b.t+' — '+b.a,'#/books']);});
  Object.entries(DATA.res).forEach(([id,r])=>{if((r.t+' '+r.why).toLowerCase().includes(q))R.push(['Resource',r.t,'#/resources']);});
  DATA.models.forEach(m=>{if((m.name+' '+m.deep).toLowerCase().includes(q))R.push(['Mental model',m.name,'#/models']);});
  DATA.scen.forEach(s=>{if((s.title+' '+s.setup).toLowerCase().includes(q))R.push(['Scenario',s.title,'#/owner']);});
  DATA.ceo.forEach(s=>{if((s.title+' '+s.context).toLowerCase().includes(q))R.push(['CEO sim',s.title,'#/ceo']);});
  S.notes.forEach(n=>{if((n.body+' '+(n.tag||'')).toLowerCase().includes(q))R.push(['Note',(n.tag?'#'+n.tag+' — ':'')+n.body.slice(0,70),'#/notes']);});
  S.memos.forEach(m=>{if((m.title+' '+Object.values(m.sec).join(' ')).toLowerCase().includes(q))R.push(['Memo',m.title,'#/memo']);});
  S.companies.forEach(c=>{if(c.name.toLowerCase().includes(q))R.push(['Company analysis',c.name,'#/company']);});
  S.ideas.forEach(i=>{if(i.name.toLowerCase().includes(q))R.push(['Idea',i.name,'#/idea']);});
  S.decisions.forEach(d=>{if(d.decision.toLowerCase().includes(q))R.push(['Decision',d.decision,'#/journal/dec']);});
  S.mistakes.forEach(m=>{if((m.decision+' '+m.learned).toLowerCase().includes(q))R.push(['Mistake',m.decision,'#/journal/mis']);});}
 let h='<div class="hero"><div class="kicker">Search</div><h1 class="big">“'+esc(q||'')+'”</h1><p class="lead">'+R.length+' result(s) across curriculum and your personal knowledge system.</p></div>';
 if(!R.length)h+='<div class="card dim">Nothing found. Try a concept (e.g., “moat”), a book, or your own notes.</div>';
 R.slice(0,60).forEach(r=>{h+='<a href="'+r[2]+'"><div class="card hover" style="margin-bottom:8px;display:flex;justify-content:space-between;gap:10px"><span>'+esc(r[1])+'</span>'+chip(r[0],'c-neon')+'</div></a>';});
 return h;}
function vNotFound(){return '<div class="hero"><div class="kicker">404</div><h1 class="big">Nothing here.</h1><a class="btn" href="#/">← Command Center</a></div>';}

/* ------------------------------- ROUTER ----------------------------- */
function route(){const raw=(location.hash||'#/').slice(2);const seg=raw.split('/');const r=seg[0]||'';let html='';
 if(r==='')html=vCommand();
 else if(r==='roadmap')html=vRoadmap();
 else if(r==='level')html=vLevel(seg[1]);
 else if(r==='company')html=labTab==='report'?vCompanyReport():vCompany();
 else if(r==='memo')html=vMemo();
 else if(r==='idea')html=vIdea();
 else if(r==='modeling')html=vModeling();
 else if(r==='markets')html=vMarkets();
 else if(r==='owner')html=vOwner();
 else if(r==='ceo')html=vCeo();
 else if(r==='committee')html=vCommittee();
 else if(r==='models')html=vModels();
 else if(r==='books')html=vBooks();
 else if(r==='resources')html=vResources();
 else if(r==='notes')html=vNotes();
 else if(r==='journal')html=vJournal(seg[1]==='mis'?'mis':'dec');
 else if(r==='progress')html=vProgress();
 else if(r==='about')html=vAbout();
 else if(r==='search')html=vSearch(decodeURIComponent(seg.slice(1).join('/')));
 else html=vNotFound();
 $('#view').innerHTML='<div class="view">'+html+'</div>';
 syncNav('#/'+r);window.scrollTo(0,0);}
window.addEventListener('hashchange',route);
$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(q)location.hash='#/search/'+encodeURIComponent(q);}});
buildNav();genMissions();route();
</script>
</body>
</html>
