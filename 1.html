<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMPOUNDER — Capital Intelligence System</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23061009'/%3E%3Cpath d='M6 26 Q 13 25 18 16 T 26 6' stroke='%2340FF9C' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='6' r='3' fill='%2340FF9C'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#060A08; --bg2:#080D0B; --panel:#0D1411; --panel2:#111A15; --panel3:#15211B;
  --line:#1B2A22; --line2:rgba(64,255,156,.18);
  --txt:#DDE9E1; --dim:#8FA398; --faint:#5E7066;
  --neon:#40FF9C; --neon2:#8CFFC3; --lime:#C6FF4D;
  --amber:#FFB84D; --red:#FF6B5E; --blue:#6FD3FF;
  --serif:Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(1100px 700px at 12% -8%, rgba(64,255,156,.075), transparent 60%),
   radial-gradient(900px 600px at 105% 110%, rgba(110,255,180,.05), transparent 55%),
   repeating-linear-gradient(0deg, rgba(120,255,190,.028) 0 1px, transparent 1px 52px),
   repeating-linear-gradient(90deg, rgba(120,255,190,.028) 0 1px, transparent 1px 52px);}
a{color:var(--neon2);text-decoration:none}
a:hover{color:var(--neon)}
::selection{background:rgba(64,255,156,.28)}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)} .faint{color:var(--faint)} .neon{color:var(--neon)} .amber{color:var(--amber)} .red{color:var(--red)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.2px}
/* ---------- shell ---------- */
#app{display:flex;min-height:100vh;position:relative;z-index:1}
#side{width:256px;flex:0 0 256px;background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 0 30px}
.brand{padding:6px 20px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .mark{display:flex;gap:10px;align-items:center}
.brand h1{font-family:var(--mono);font-size:15px;letter-spacing:.32em;color:var(--txt);font-weight:700}
.brand .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--faint);margin-top:5px}
.ngroup{padding:14px 0 4px}
.ngroup .gl{font-family:var(--mono);font-size:9.5px;letter-spacing:.28em;color:var(--faint);padding:0 20px 6px;text-transform:uppercase}
.nitem{display:block;padding:7px 20px 7px 24px;color:var(--dim);font-size:13.5px;border-left:2px solid transparent;transition:all .15s}
.nitem:hover{color:var(--txt);background:rgba(64,255,156,.045)}
.nitem.active{color:var(--neon);border-left-color:var(--neon);background:rgba(64,255,156,.06)}
.nitem .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--neon);margin-right:8px;opacity:.7;box-shadow:0 0 8px rgba(64,255,156,.8)}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:14px;padding:12px 26px;border-bottom:1px solid var(--line);background:rgba(8,13,11,.8);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20}
#top .crumb{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;flex:0 0 auto}
#search{flex:1;max-width:420px;background:#0A100D;border:1px solid var(--line);color:var(--txt);font-family:var(--mono);font-size:12.5px;padding:8px 12px;border-radius:6px;outline:none;transition:all .15s}
#search:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(64,255,156,.12)}
#lvlchip{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--neon);border:1px solid var(--line2);padding:6px 12px;border-radius:99px;background:rgba(64,255,156,.05);white-space:nowrap}
#view{padding:28px 30px 60px;max-width:1240px;width:100%;margin:0 auto}
footer{padding:16px 30px 28px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);max-width:1240px;margin:0 auto;width:100%}
/* ---------- cards / ui ---------- */
.card{background:linear-gradient(180deg,var(--panel),#0B100D);border:1px solid var(--line);border-radius:10px;padding:20px;transition:border-color .16s, transform .16s, box-shadow .16s}
.card.hover:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 1px rgba(64,255,156,.07)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--neon);text-transform:uppercase;margin-bottom:8px}
.sec{margin-bottom:34px}
.sec>h2{font-size:24px;margin-bottom:14px}
.hero{margin-bottom:30px}
.hero .big{font-family:var(--serif);font-size:36px;line-height:1.15;margin:6px 0 10px}
.hero p.lead{color:var(--dim);max-width:820px;font-size:15.5px}
.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--dim);margin:2px 4px 2px 0;white-space:nowrap}
.chip.c-neon{color:var(--neon);border-color:var(--line2);background:rgba(64,255,156,.06)}
.chip.c-amber{color:var(--amber);border-color:rgba(255,184,77,.35)}
.chip.c-red{color:var(--red);border-color:rgba(255,107,94,.35)}
.chip.c-blue{color:var(--blue);border-color:rgba(111,211,255,.3)}
.btn{display:inline-block;background:transparent;border:1px solid var(--line);color:var(--txt);font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:8px 16px;border-radius:6px;cursor:pointer;transition:all .15s;text-align:center}
.btn:hover{border-color:var(--neon);color:var(--neon);box-shadow:0 0 14px rgba(64,255,156,.15)}
.btn.primary{background:var(--neon);border-color:var(--neon);color:#04130B;font-weight:700}
.btn.primary:hover{box-shadow:0 0 22px rgba(64,255,156,.45);color:#04130B}
.btn.ghost{border-color:transparent;color:var(--dim)}
.btn.ghost:hover{color:var(--neon);box-shadow:none}
.btn.sm{padding:5px 11px;font-size:11px}
.btn.danger{border-color:rgba(255,107,94,.4);color:var(--red)}
.btn.danger:hover{box-shadow:0 0 12px rgba(255,107,94,.25)}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;background:#0A100D;border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:9px 12px;font-family:var(--sans);font-size:14px;outline:none;transition:border-color .15s, box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(64,255,156,.1)}
textarea{resize:vertical;min-height:74px}
label.f{display:block;margin-bottom:12px}
label.f .fl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;display:block;margin-bottom:5px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid rgba(27,42,34,.6)}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono)}
.bar{height:8px;background:#0A100D;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#1E7A52,var(--neon));box-shadow:0 0 10px rgba(64,255,156,.5);transition:width .5s ease}
.st{font-family:var(--mono);font-size:10px;letter-spacing:.12em;padding:4px 10px;border-radius:4px;text-transform:uppercase}
.st-done{background:var(--neon);color:#04130B;font-weight:700;box-shadow:0 0 14px rgba(64,255,156,.4)}
.st-in{border:1px solid var(--amber);color:var(--amber)}
.st-open{border:1px solid var(--neon);color:var(--neon);animation:pulse 2.6s infinite}
.st-locked{border:1px solid var(--line);color:var(--faint)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(64,255,156,.25)}50%{box-shadow:0 0 0 6px rgba(64,255,156,0)}}
.rise{animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view .sec:nth-child(2){animation-delay:.04s}.view .sec:nth-child(3){animation-delay:.08s}.view .sec:nth-child(4){animation-delay:.12s}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dashed rgba(27,42,34,.8);font-size:13.5px}
.kv .k{color:var(--dim)} .kv .v{font-family:var(--mono)}
.qopt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:11px 14px;margin-bottom:8px;cursor:pointer;transition:all .14s;font-size:14px}
.qopt:hover{border-color:var(--line2)}
.qopt input{margin-top:3px;accent-color:var(--neon)}
.qopt.good{border-color:var(--neon);background:rgba(64,255,156,.06)}
.qopt.bad{border-color:var(--red);background:rgba(255,107,94,.06)}
.expl{font-size:12.5px;color:var(--dim);border-left:2px solid var(--neon);padding:6px 12px;margin:8px 0 16px;background:rgba(64,255,156,.035);border-radius:0 6px 6px 0}
.listline{padding:9px 0;border-bottom:1px solid rgba(27,42,34,.6);font-size:14px}
.listline:last-child{border-bottom:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:7px 13px;border:1px solid var(--line);border-radius:6px;color:var(--dim);cursor:pointer;transition:all .14s;background:none}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--neon);border-color:var(--neon);background:rgba(64,255,156,.07);box-shadow:0 0 12px rgba(64,255,156,.12)}
.spine{list-style:none;position:relative;padding-left:34px}
.spine::before{content:'';position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,var(--neon),rgba(64,255,156,.12))}
.node{position:absolute;left:4px;top:22px;width:16px;height:16px;border-radius:50%;border:2px solid var(--faint);background:var(--bg)}
.node.done{background:var(--neon);border-color:var(--neon);box-shadow:0 0 12px rgba(64,255,156,.7)}
.node.in{border-color:var(--amber);background:linear-gradient(90deg,var(--amber) 50%,var(--bg) 50%)}
.node.open{border-color:var(--neon);animation:pulse 2.6s infinite}
.lvc{position:relative;margin-bottom:14px;cursor:pointer}
.lvc .card{padding-left:24px}
.lvc:hover .card{border-color:var(--line2);transform:translateY(-2px)}
.att label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13.5px;color:var(--dim);cursor:pointer}
.att input{accent-color:var(--neon);margin-top:3px}
.extbtn{display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--neon);border:1px solid var(--line2);padding:5px 11px;border-radius:5px;transition:all .14s}
.extbtn:hover{background:rgba(64,255,156,.1);box-shadow:0 0 10px rgba(64,255,156,.2)}
.resultbox{background:#0A110D;border:1px solid var(--line2);border-radius:8px;padding:16px;margin-top:12px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--panel3);border:1px solid var(--neon);color:var(--neon);font-family:var(--mono);font-size:12px;padding:12px 18px;border-radius:8px;box-shadow:0 0 24px rgba(64,255,156,.3);z-index:99;animation:rise .3s ease}
.pill-tier{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;padding:3px 8px;border-radius:3px;text-transform:uppercase}
.t-must{background:var(--neon);color:#04130B;font-weight:700}
.t-rec{border:1px solid var(--neon);color:var(--neon)}
.t-ref{border:1px solid var(--blue);color:var(--blue)}
.t-adv{border:1px solid var(--amber);color:var(--amber)}
.t-opt{border:1px solid var(--line);color:var(--faint)}
.stat .n{font-family:var(--mono);font-size:26px;color:var(--neon)}
.stat .l{font-size:11.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase}
blockquote{border-left:3px solid var(--neon);padding:10px 18px;font-family:var(--serif);font-size:17px;color:var(--txt);background:rgba(64,255,156,.04);border-radius:0 8px 8px 0;font-style:italic}
blockquote .attr{display:block;font-family:var(--mono);font-style:normal;font-size:11px;color:var(--faint);margin-top:8px;letter-spacing:.1em}
@media(max-width:1080px){.g3{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}}
@media(max-width:920px){
 #app{flex-direction:column}
 #side{width:100%;flex:none;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);padding-bottom:8px}
 .ngroup{display:flex;flex-wrap:wrap;gap:2px;padding:6px 12px}.ngroup .gl{display:none}
 .nitem{border-left:none;border:1px solid transparent;border-radius:6px;padding:6px 10px;font-size:12px}
 #view{padding:20px 16px 50px}.g2,.g3,.g4{grid-template-columns:1fr}
 #top{flex-wrap:wrap}#search{order:3;flex-basis:100%;max-width:none}
}
@media print{#side,#top,.btn{display:none!important}body{background:#fff;color:#000}body::before{display:none}.card{border-color:#999}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<noscript><p style="padding:30px;font-family:monospace">COMPOUNDER requires JavaScript. Enable it and reload.</p></noscript>
<div id="app">
  <aside id="side" aria-label="Primary navigation"></aside>
  <div id="main">
    <header id="top">
      <span class="crumb mono" id="crumb">COMMAND</span>
      <input id="search" type="search" placeholder="search levels, books, models, notes, memos…  [Enter]" aria-label="Global search">
      <span id="lvlchip">—</span>
    </header>
    <main id="view" aria-live="polite"></main>
    <footer>COMPOUNDER is an educational system for business &amp; financial analysis. It teaches frameworks and judgment — it does not give personalized financial advice and does not guarantee any investment returns. Study risk before reward. External links open third-party sources.</footer>
  </div>
</div>
<script>
"use strict";
/* =====================================================================
   COMPOUNDER — a personal capital intelligence system.
   Content model: Stages -> Levels -> {concepts, books, resources,
   exercises, case, mastery gate}. User state persisted in localStorage.
   ===================================================================== */

/* ----------------------------- helpers ------------------------------ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const n0=x=>isFinite(x)?fmt.format(x):'—';
const pct=x=>isFinite(x)?(x*100).toFixed(1)+'%':'—';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dayNum=()=>Math.floor(Date.now()/864e5);
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3400);}

/* ----------------------------- store -------------------------------- */
const KEY='compounder.v1';
let S;
function defState(){return{v:1,levels:{},notes:[],memos:[],companies:[],ideas:[],decisions:[],mistakes:[],activity:[],missions:{},calc:{},scen:{},ceo:{},committee:[],resDone:{},createdAt:Date.now()};}
function load(){try{const r=localStorage.getItem(KEY);return r?Object.assign(defState(),JSON.parse(r)):defState();}catch(e){return defState();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
S=load();
function log(type,label){S.activity.unshift({t:Date.now(),type,label});S.activity=S.activity.slice(0,300);save();}

/* =====================================================================
   CURRICULUM DATA — the intellectual core of the system.
   ===================================================================== */
const DATA={stages:[],levels:{},books:{},res:{},models:[],scen:[],ceo:[],commQ:[],drills:{},quotes:[],tiers:['must','rec','ref','adv','opt'],tierName:{must:'Must Read',rec:'Highly Recommended',ref:'Reference',adv:'Advanced',opt:'Optional / Historical'}};

DATA.stages=[
{id:'S1',name:'Foundation',theme:'See Reality',levels:['L1','L2','L3','L4']},
{id:'S2',name:'Competence',theme:'Read the Machine',levels:['L5','L6','L7','L8']},
{id:'S3',name:'Applied Analysis',theme:'Value the Machine',levels:['L9','L10','L11','L12']},
{id:'S4',name:'Advanced Thinking',theme:'Judge the Machine',levels:['L13','L14','L15','L16']},
{id:'S5',name:'Professional Judgment',theme:'Run the Machine',levels:['L17','L18','L19','L20']},
{id:'S6',name:'Mastery',theme:'Become the Allocator',levels:['L21','L22']}
];

/* ------------------------------ LEVELS ------------------------------ */
DATA.levels={
L1:{stage:'S1',code:'F-01',title:'What a Business Actually Is',hours:12,prereq:[],
why:'Every advanced idea in this system collapses without a first-principles picture of a business: someone pays because a problem gets solved, and the price must exceed the full cost of serving.',
cap:'You can describe any business in one page: who pays, why they choose it, and where profit truly comes from.',
out:['Explain why a business exists in one paragraph','Trace one rupee from customer to profit','Distinguish accounting profit from economic profit','Separate value creation from value capture','State the four tests of a real business'],
concepts:[
{t:'Value creation vs value capture',d:'Solving a problem creates value; you keep only what pricing and competition allow.'},
{t:'The profit formula',d:'Revenue = price × volume; profit = revenue − full cost of serving, including capital.'},
{t:'Accounting vs economic profit',d:'Economic profit also charges for the opportunity cost of capital — most “profitable” firms earn none.'},
{t:'Customer job-to-be-done',d:'Customers hire products for jobs; the job, not the product, defines your market.'},
{t:'Unit economics preview',d:'Contribution per unit = price − variable cost; broken units never add up to a healthy business.'},
{t:'Two-sided & platform models',d:'Some businesses charge one side of a market to subsidise the other (ads, marketplaces).'}],
models:['oppcost','coc'],
books:['b8','b6','b32'],
res:['r12','r11'],
ex:[{t:'The ₹100 trace',d:'Buy a product near you. Trace where every ₹100 of its price plausibly goes: materials, labour, rent, logistics, marketing, margin.'},{t:'One-page teardown',d:'Pick any company you use weekly. One page: who pays, why them, revenue model, biggest cost, biggest risk.'},{t:'Chai stall economics',d:'Estimate a street vendor’s daily revenue, costs, and monthly profit. Compare their ROIC to a tech startup’s.'}],
cse:{title:'The honest tea stall vs the funded café chain',brief:'A stall owner earns real cash on tiny capital; a chain raises crores and loses money per cup. Which is “better” — and what question decides it? (Hint: return on incremental capital, and who bears the risk.)'},
mist:['Confusing revenue with value creation','Judging a business by its story instead of who pays','Forgetting the owner’s own labour and capital as costs'],
gate:{q:[
{q:'A business fundamentally exists because…',o:['it raises capital from investors','it solves a problem for someone at a price above the cost of serving','it hires people and grows revenue','it owns assets'],a:1,w:'Payment is the only honest vote. Revenue raised or spent proves nothing; a customer paying above full cost does.'},
{q:'Accounting profit differs from economic profit because economic profit also deducts…',o:['taxes','depreciation','the opportunity cost of the owner’s capital and labour','interest payments'],a:2,w:'If your capital could earn 10% elsewhere, “profit” below that is an economic loss wearing a costume.'},
{q:'The strongest evidence customers genuinely value a product is…',o:['large app downloads','press coverage','repeat purchases at a price that covers costs','influencer praise'],a:2,w:'Repeat purchase with money is signal; attention is noise.'}]}},

L2:{stage:'S1',code:'F-02',title:'Accounting I — The Language of Business',hours:25,prereq:['L1'],
why:'Financial statements are the raw data of every judgment you will ever make about a company. Misread them and every later level is built on sand.',
cap:'You can explain the three statements, how they link, and why accrual accounting both enables and enables deception.',
out:['Explain the three statements and how they articulate','Record simple transactions with double-entry logic','Explain accrual vs cash accounting with examples','Compute gross margin, operating margin, net margin','List three ways earnings can be legally embellished'],
concepts:[
{t:'The three statements',d:'Income statement (performance over time), balance sheet (position at a moment), cash flow (actual cash movement).'},
{t:'Double-entry logic',d:'Every transaction touches two things: assets = liabilities + equity, always.'},
{t:'Accrual vs cash',d:'Revenue when earned, expenses when incurred — not when cash moves. Powerful, and manipulable.'},
{t:'Depreciation & capitalisation',d:'Spreading asset cost over life; the choice of what to capitalise is a judgment that shapes profit.'},
{t:'Margins',d:'Gross, operating, and net margins locate where money leaks in the model.'},
{t:'Working capital',d:'Receivables + inventory − payables: cash trapped in operations.'}],
models:['inversion','incentives'],
books:['b2','b4','b5'],
res:['r12','r11'],
ex:[{t:'Ten transactions',d:'Record: capital injected, loan taken, machine bought, inventory on credit, sale on credit, salary paid, depreciation, cash collected, loan repaid, dividend. Write the impact on each statement.'},{t:'Personal balance sheet',d:'Build your own: assets, liabilities, net worth. Now your monthly “income statement”.'},{t:'Real statement walk',d:'Open any Indian listed company’s annual report (BSE/NSE). Find revenue, PPE, borrowings, CFO. Just locate them.'}],
cse:{title:'Why profit is an opinion, cash is a fact',brief:'Two identical shops, one sells on credit and stocks inventory aggressively. Same cash in the till, wildly different profits. Which one is riskier, and which statement reveals it?'},
mist:['Treating net income as cash','Forgetting that borrowing raises assets and liabilities together','Assuming reported profit is “real” before checking the cash flow statement'],
gate:{q:[
{q:'You buy a machine for ₹10 lakh, paying cash. Immediately:',o:['an expense of ₹10 lakh hits the P&L','cash falls, fixed assets rise; no full P&L expense yet','assets fall by ₹10 lakh','equity rises'],a:1,w:'Capex is capitalised on the balance sheet and expensed gradually via depreciation.'},
{q:'Which transaction increases assets and liabilities by the same amount?',o:['paying a supplier','a bank loan arriving in your account','collecting cash from a customer','paying a dividend'],a:1,w:'Cash (asset) up, loan (liability) up — the accounting equation stays balanced.'},
{q:'Accrual accounting means…',o:['recording revenue only when cash arrives','recording revenue when earned and expenses when incurred','only large firms must record expenses','cash flow equals profit'],a:1,w:'Matching economic events to periods is the power — and the vulnerability — of accrual accounting.'}]}},

L3:{stage:'S1',code:'F-03',title:'Business Economics — How Value Behaves',hours:20,prereq:['L1'],
why:'Economics is the physics of business: prices, incentives, elasticity and marginal decisions determine who survives. Without it, strategy is storytelling.',
cap:'You can reason about pricing, demand response, costs, and incentives in any market using marginal analysis.',
out:['Use supply/demand and elasticity to predict revenue effects of price changes','Apply marginal thinking to produce-or-not decisions','Define and apply opportunity cost','Explain why incentives predict behavior better than intentions','Identify economies of scale and their limits'],
concepts:[
{t:'Elasticity',d:'How quantity demanded responds to price; decides whether price hikes raise or destroy revenue.'},
{t:'Marginal analysis',d:'Decisions happen at the edge: produce if price > marginal cost, in the short run.'},
{t:'Opportunity cost',d:'The value of the next-best alternative; the true cost of every choice.'},
{t:'Incentives',d:'People respond to the payoff structure they face — design the structure, predict the behavior.'},
{t:'Economies of scale',d:'Unit costs fall with volume via fixed-cost spreading, purchasing, learning — until complexity reverses them.'},
{t:'Comparative advantage & trade',d:'Do what you’re relatively best at; outsource the rest.'}],
models:['oppcost','incentives','scale'],
books:['b6','b7'],
res:['r11','r12'],
ex:[{t:'Elasticity hunt',d:'Pick three purchases of yours (salt, phone, flights). Rank their price elasticity and explain why.'},{t:'Subsidy analysis',d:'Use Hazlitt’s lens: pick one subsidy or price control; trace effects on the intended group, everyone else, and over time.'},{t:'Your own opportunity cost',d:'Compute the hourly value of your time under your three most likely career paths. What does it imply about what you should outsource?'}],
cse:{title:'The airline pricing machine',brief:'Same seat, ten prices. Why does price discrimination work in flights but not in groceries? What must be true about demand, segmentation and arbitrage?'},
mist:['Treating demand as fixed when price changes','Ignoring second-order effects of interventions','Confusing intent with incentive-driven behavior'],
gate:{q:[
{q:'A firm raises price and total revenue falls. Demand was…',o:['inelastic','elastic','unit elastic','perfectly inelastic'],a:1,w:'When quantity falls faster than price rises, demand is elastic — the customer had alternatives.'},
{q:'In the short run, a firm should shut down production if price falls below…',o:['average total cost','average fixed cost','average variable cost','marginal cost of the last unit'],a:2,w:'If you cannot even cover variable costs per unit, every sale deepens the loss; fixed costs are sunk in the short run.'},
{q:'Opportunity cost is best defined as…',o:['the accounting cost of inputs','the value of the next-best alternative forgone','the cash paid for an asset','the tax on a decision'],a:1,w:'Every yes is a thousand invisible nos. The best rejected option is the real price.'}]}},

L4:{stage:'S1',code:'F-04',title:'Numbers & Compounding — The Operating System',hours:15,prereq:['L1'],
why:'Compounding, ratios and present value are the arithmetic that all of finance is built on. Fluency here is what lets the rest of this system move at thought-speed.',
cap:'You can compute compounding, doubling times, ratios and basic present values fluently, without a tutorial.',
out:['Compound growth forward and backward in your head','Use the Rule of 72 correctly','Explain why +50% then −50% loses money','Discount a future rupee to today and explain why','Read ratios (per-share, per-unit, per-employee) like an analyst'],
concepts:[
{t:'Compound growth',d:'Growth on growth: small rates over long times produce absurd outcomes — the engine of wealth and of frauds.'},
{t:'Rule of 72',d:'Years to double ≈ 72 ÷ annual rate. A constant sanity anchor.'},
{t:'Asymmetry of losses',d:'−50% requires +100% to recover. Capital preservation is arithmetic, not fear.'},
{t:'Time value of money',d:'A rupee today is worth more than a rupee tomorrow; discounting converts futures into todays.'},
{t:'Per-unit thinking',d:'Normalise everything: per share, per customer, per store, per employee. Absolutes hide; ratios reveal.'},
{t:'Percent vs percentage points',d:'Margin moving 20%→25% is +5pp but +25% relative. Mixing them up is an amateur tell.'}],
models:['compounding'],
books:['b10'],
res:['r12'],
ex:[{t:'Doubling ledger',d:'Table: 6%, 10%, 12%, 15%, 20% over 5/10/20/30 years on ₹1 lakh. Compute with Rule of 72, then verify exactly.'},{t:'The seesaw',d:'Prove algebraically: +x% then −x% always loses money. What rate pair breaks even at x=50?'},{t:'Discount three futures',d:'PV of ₹1,000 in 1/5/10 years at 10%. Notice how duration eats value.'}],
cse:{title:'The patient compounding machine',brief:'Berkshire’s story is not picking winners — it is ~20% CAGR sustained for decades. Compute what ₹1 lakh becomes at 20% for 40 years, and why almost nobody can sit still long enough to get it.'},
mist:['Adding percentages that should be compounded','Believing big gains and big losses are symmetric','Discounting nothing and overpaying for distant promises'],
gate:{q:[
{q:'₹100 compounded at 10%/year for 3 years becomes closest to…',o:['₹130','₹133.10','₹121','₹140'],a:1,w:'100×1.1³ = 133.1 — the extra 3.1 over simple interest is compounding doing its quiet work.'},
{q:'At 8% annual return, money doubles in roughly…',o:['7 years','9 years','12 years','8 years'],a:1,w:'72 ÷ 8 = 9. Memorise this anchor; it forever calibrates your return expectations.'},
{q:'₹10,000 grows 50% then falls 50%. Final value:',o:['₹10,000','₹7,500','₹8,500','₹9,000'],a:1,w:'15,000 → 7,500. Losses bite harder than equal gains heal. Risk management is arithmetic.'}]}},

L5:{stage:'S2',code:'C-01',title:'Financial Statement Analysis — Reading the Machine',hours:30,prereq:['L2','L4'],
why:'This is where accounting becomes analysis: you stop transcribing statements and start interrogating them — quality of earnings, returns on capital, and what the balance sheet whispers about risk.',
cap:'You can take any listed company’s statements and produce a ratio-driven read of profitability, risk, and earnings quality.',
out:['Run a full ratio analysis (profitability, leverage, liquidity, efficiency)','Decompose ROE with DuPont and identify the driver','Judge earnings quality with CFO/NI and accruals','Spot at least five classic accounting red flags','Compare two competitors numerically'],
concepts:[
{t:'DuPont decomposition',d:'ROE = net margin × asset turnover × leverage. Same ROE can mean three completely different businesses.'},
{t:'ROIC vs ROE',d:'ROIC measures the engine (operating returns on all capital); ROE can be inflated by debt. Owner-operators track ROIC.'},
{t:'Earnings quality',d:'Sustained CFO below net income is a warning light; accruals eventually reverse in cash.'},
{t:'Working capital cycle',d:'Days receivable, inventory, payable — how fast cash converts. Negative cycles are business-model superpowers.'},
{t:'Leverage & coverage',d:'Debt/EBITDA and interest coverage measure how much bad luck the structure tolerates.'},
{t:'Segment & related-party scrutiny',d:'Conglomerates hide weak units in segments; related parties move value quietly.'}],
models:['inversion','incentives'],
books:['b2','b5','b4'],
res:['r8','r6','r7','r12'],
ex:[{t:'DuPont duel',d:'Take two firms in the same industry (e.g., two paint or FMCG companies). Decompose ROE; write which engine is superior and why.'},{t:'Quality screen',d:'For one company, chart 5 years of NI vs CFO and compute CFO/NI. Verdict: quality or fiction?'},{t:'Red flag audit',d:'Using Financial Shenanigans’ categories, scan one annual report: channel stuff indicators, capitalised costs, one-time gains, accounting changes.'}],
cse:{title:'The company that was profitable into bankruptcy',brief:'Growing revenue, healthy net income — and negative operating cash flow for three straight years. Walk the mechanism by which accruals masked the bleed, and which single ratio would have told you earliest.'},
mist:['Trusting net income before cash flow','Celebrating ROE built purely on leverage','Comparing ratios across different business models'],
gate:{q:[
{q:'DuPont analysis decomposes ROE into…',o:['revenue × expenses × tax','net margin × asset turnover × equity multiplier','EBITDA − capex − interest','assets − liabilities'],a:1,w:'Profit per rupee sold × sales per rupee of assets × leverage. Three very different routes to the same ROE.'},
{q:'Net income rising for years while operating cash flow falls is most often a sign of…',o:['great growth','deteriorating earnings quality — accruals, receivables or inventory building up','tax efficiency','nothing important'],a:1,w:'Profit is a opinion you can manage; cash is the referee that eventually arrives.'},
{q:'A high ROE driven almost entirely by high leverage should make an analyst…',o:['more confident — returns are higher','wary — returns are amplified in both directions, and so is ruin risk','indifferent','value the company higher automatically'],a:1,w:'Leverage is a magnifying glass pointed at both fortune and catastrophe.'}]}},

L6:{stage:'S2',code:'C-02',title:'Corporate Finance — Time, Risk & Capital',hours:30,prereq:['L4','L2'],
why:'This level converts “money over time” into decision machinery: NPV, cost of capital and capital structure — the rules by which every serious rupee of investment gets judged.',
cap:'You can evaluate any project or business decision with NPV/IRR discipline and explain what capital actually costs.',
out:['Compute PV, FV, NPV by hand and with tools','Apply the NPV decision rule correctly','Compute IRR and know its three classic traps','Explain cost of equity, cost of debt and WACC','Describe how debt changes risk and return for owners'],
concepts:[
{t:'Present value',d:'Discounting converts future cash into today’s terms; the rate is the price of time plus risk.'},
{t:'NPV rule',d:'Accept only projects whose discounted cash flows exceed their cost — positive NPV creates value, full stop.'},
{t:'IRR & its traps',d:'The discount rate that zeroes NPV; breaks with non-conventional flows, assumes reinvestment at IRR, and seduces with big numbers.'},
{t:'Cost of capital',d:'What capital providers require; CAPM gives the equity piece, WACC blends the structure.'},
{t:'Capital structure',d:'Debt is cheaper but dangerous: tax shield up front, distress risk behind.'},
{t:'Annuities & perpetuities',d:'Closed-form shortcuts that underpin terminal values and loan math.'}],
models:['compounding','coc'],
books:['b15'],
res:['r13','r12'],
ex:[{t:'NPV gauntlet',d:'Five projects, mixed cash-flow signs. Rank by NPV at 12%; find where IRR misleads and why.'},{t:'WACC build',d:'For one real company: market cap, debt, beta, risk-free rate, ERP → cost of equity, after-tax cost of debt, WACC. Write your assumptions.'},{t:'The EMI anatomy',d:'Amortisation schedule for a ₹50 lakh home loan at 8.5%/20yr. Watch how much of early payments is pure interest.'}],
cse:{title:'The machine that prints ₹1.10 for every ₹1',brief:'A project costs ₹100 and returns ₹30/yr for 5 years. At what discount rate does it stop making sense? Why do managers still build negative-NPV factories? (Empire-building, incentives, sunk optimism.)'},
mist:['Choosing projects by IRR alone','Using one discount rate for all risks','Forgetting that the cost of capital is set by risk, not by desire'],
gate:{q:[
{q:'The present value of ₹110 received in one year at a 10% discount rate is…',o:['₹110','₹100','₹99','₹121'],a:1,w:'110 ÷ 1.10 = 100. Discounting is just compounding walked backwards.'},
{q:'The NPV decision rule says: accept a project when…',o:['IRR exceeds the bank deposit rate','NPV is positive at a risk-appropriate cost of capital','payback is under 3 years','accounting profit is positive'],a:1,w:'Positive NPV at the right hurdle rate is the only definition of value creation that survives scrutiny.'},
{q:'A genuine danger of IRR is…',o:['it ignores cash flows','it can be multiple or nonexistent for unconventional cash-flow patterns and assumes reinvestment at the IRR','it is always lower than NPV','it cannot be computed for projects'],a:1,w:'IRR is a rate, not a value; it lies politely when flows change sign or reinvestment reality differs.'}]}},

L7:{stage:'S2',code:'C-03',title:'Markets & Instruments — Where Prices Are Born',hours:25,prereq:['L4','L6'],
why:'Before you can disagree with the market you must understand what it is: an auction of expectations. This level builds the map of instruments and the crucial line between investing and speculation.',
cap:'You can explain how equities, bonds, funds and derivatives actually work, and classify any activity as investing, speculation, trading or gambling — with reasons.',
out:['Explain how exchanges, indices and price discovery work','Describe bonds and the inverse price–yield relationship','Compare index funds vs active management with evidence','Define derivatives and what risks they transfer','Classify investing vs speculation vs trading vs gambling'],
concepts:[
{t:'Price vs value',d:'Price is what the marginal buyer pays today; value is what the asset produces. They agree only occasionally.'},
{t:'Mr. Market',d:'The market is there to serve you prices, not to instruct you — exploit its moods, don’t imitate them.'},
{t:'Bonds & rates',d:'Fixed promises; when rates rise, existing bond prices fall. Duration measures sensitivity.'},
{t:'Index investing',d:'Owning the whole market at near-zero cost wins against most active managers after fees — a base rate to respect.'},
{t:'Derivatives',d:'Contracts derived from assets: insurance for some, leverage for others, ruin for the careless.'},
{t:'Graham’s definition',d:'Investing = thorough analysis + safety of principal + adequate return. Everything else is speculation.'}],
models:['mrmarket','mos'],
books:['b1','b30','b31','b10'],
res:['r1','r12','r8'],
ex:[{t:'Instrument zoo',d:'One page: equity, corporate bond, gilt, mutual fund, ETF, futures, options — each: what it is, who uses it, what risk it carries.'},{t:'Fee autopsy',d:'Compute the 20-year terminal wealth difference between 12% gross at 0.1% cost vs 2% cost. Let the number upset you.'},{t:'Classify yourself',d:'List ten market activities (IPO flipping, index SIP, F&O trading, crypto, gold…). Label each: invest/speculate/trade/gamble, and justify.'}],
cse:{title:'Why the professionals lose to the index',brief:'Most active funds underperform their benchmark net of fees over 10+ years. Diagnose the arithmetic: fees, churn, taxes, and the zero-sum nature of outperformance before costs.'},
mist:['Confusing a rising price with being right','Treating derivatives as assets rather than contracts','Letting the market’s mood set your thesis'],
gate:{q:[
{q:'Per Benjamin Graham, an investment operation requires…',o:['thorough analysis, safety of principal, and an adequate return','holding for more than one year','buying famous companies','predicting the market'],a:0,w:'Everything failing those three tests is speculation — sometimes fine, but never confuse the two.'},
{q:'The primary structural reason index funds beat most active managers over long horizons is…',o:['insider access','lower costs — fees are subtracted from gross returns, and markets are roughly zero-sum before costs','guaranteed returns','better luck'],a:1,w:'Before costs, active investors collectively earn the market. After costs, the average must lose to the index.'},
{q:'Bond prices generally move … to interest rates.',o:['in the same direction','opposite — rates up, existing bond prices fall','unrelated','only at maturity'],a:1,w:'Your fixed coupon becomes less attractive when new issues pay more, so the price must fall to compensate.'}]}},

L8:{stage:'S2',code:'C-04',title:'Behavioral Foundations — The Enemy in the Mirror',hours:20,prereq:['L3'],
why:'Markets are made of humans, and you are one. The largest edge available to anyone is systematically making fewer psychological errors than the crowd — this level names the errors.',
cap:'You can identify the major cognitive biases in yourself and in corporate/investor behavior, and you have written personal checklists to defend against them.',
out:['Define the ten major biases and give a business example of each','Explain Munger’s incentive-caused bias','Write a personal pre-mortem and kill-criteria checklist','Distinguish signal from noise in a narrative','Recognise narrative fallacy in your own theses'],
concepts:[
{t:'Incentive-caused bias',d:'“Show me the incentive and I’ll show you the outcome.” People rationalise toward their payoff.'},
{t:'Confirmation & anchoring',d:'You recruit evidence for what you already believe, and the first number you saw owns you.'},
{t:'Sunk cost & loss aversion',d:'Dead money should have no vote; yet losses hurt ~twice as much as equal gains please.'},
{t:'Overconfidence & hindsight',d:'Everyone is above-average; every past outcome “obvious” after the fact. Both are illusions.'},
{t:'Social proof & authority',d:'Crowds and titles override evidence — the mechanism behind every bubble.'},
{t:'Survivorship bias',d:'You study winners because losers can’t publish; base rates get erased.'}],
models:['inversion','base','incentives'],
books:['b9','b12','b50'],
res:['r16','r1'],
ex:[{t:'Bias audit',d:'Take three past decisions of yours (money, career, purchases). Diagnose the bias that shaped each.'},{t:'Incentive map',d:'Map the incentives of: a sell-side analyst, a mutual fund salesperson, a founder raising a round, a regulator. Predict each one’s behavior.'},{t:'Pre-mortem ritual',d:'For a current belief, write: “It’s one year later and this failed badly. Why?” — before deciding.'}],
cse:{title:'The anatomy of a bubble',brief:'Tulips, 1929, dot-com, 2008 housing: different assets, identical psychology — narrative, social proof, leverage, anchoring on recent gains. Build the common checklist.'},
mist:['Believing you are the exception to biases','Treating bias checklists as decoration rather than mandatory gates','Judging decisions by outcomes instead of process'],
gate:{q:[
{q:'The sunk-cost fallacy means…',o:['cutting losses too early','continuing an endeavor chiefly because of previously invested resources that cannot be recovered','investing in sinking companies','diversifying too much'],a:1,w:'The money is already gone; only future costs and benefits get a vote.'},
{q:'“Show me the incentive and I will show you the outcome” implies analysts should first ask…',o:['what is the CEO’s vision?','who benefits, financially and reputationally, from the story I’m being told?','what is the stock price doing?','what do the headlines say?'],a:1,w:'Follow the payoff and behavior becomes predictable — including your own.'},
{q:'The most effective defense against confirmation bias is to…',o:['seek more supporting evidence','pre-commit what evidence would disprove you, and hunt for it','increase position size','follow consensus'],a:1,w:'A thesis without a defined kill condition is a wish. Write the disconfirmation test before you fall in love.'}]}},

L9:{stage:'S3',code:'A-01',title:'Valuation I — Intrinsic Value & the DCF',hours:35,prereq:['L5','L6'],
why:'Valuation is where analysis becomes a price you can act on. You learn the discounted-cash-flow architecture, its inputs, its sensitivities, and exactly where it breaks.',
cap:'You can value a stable business with a two-stage DCF, run sensitivity tables, and state precisely which assumptions carry the answer.',
out:['Build a two-stage DCF end to end','Explain terminal value and why it dominates the result','Use earnings power value as a no-growth anchor','Choose discount rates defensibly','Read PE/EV-EBITDA with their failure modes'],
concepts:[
{t:'DCF architecture',d:'Value = PV of explicit-period cash flows + PV of terminal value, discounted at risk-adjusted rate.'},
{t:'Terminal value dominance',d:'In growth firms, >50–70% of value sits in the terminal assumption — handle with both hands.'},
{t:'FCF definition',d:'NOPAT + D&A − capex − Δworking capital: the cash the engine actually produces for capital providers.'},
{t:'Earnings power value',d:'Value assuming zero growth: normalized earnings ÷ cost of capital. If you need growth to justify the price, say so.'},
{t:'Multiples as shorthand',d:'PE and EV/EBITDA compress growth+risk into one number — useful, and dangerously context-blind.'},
{t:'Story → numbers',d:'Every narrative (growth, moat, disruption) must convert into growth, margins, reinvestment and life — or it isn’t a valuation.'}],
models:['mos','mrmarket','coc'],
books:['b17','b16','b1','b46'],
res:['r2','r3','r8'],
ex:[{t:'First DCF',d:'Value a simple, stable business (think FMCG or utility): 5-year FCF path, terminal at perpetuity growth, WACC with stated assumptions. Sensitivity table on g and r.'},{t:'Reverse engineer',d:'Take a listed stock’s market cap. Using the Modeling Lab’s reverse DCF, extract the growth the price implies. Is it optimism or fantasy?'},{t:'EPV check',d:'Compute earnings power value for one company. Compare EPV vs market cap: is the market paying for growth assets? How much?'}],
cse:{title:'The $100 billion rounding error',brief:'A DCF of a hypergrowth firm shows terminal value = 80% of the result. Demonstrate how ±1% on terminal growth or discount rate moves value more than five years of forecast heroics.'},
mist:['False precision: reporting DCF to the rupee','Hiding the whole thesis inside the terminal growth rate','Using one WACC for businesses of different risk'],
gate:{q:[
{q:'In a DCF of a fast-growing company, most of the computed value usually comes from…',o:['the first two years of cash flows','the terminal value assumption','the working capital line','depreciation'],a:1,w:'Long-duration value lives in the terminal input — which is why professionals argue about perpetuity growth, not year-2 EBITDA.'},
{q:'A PE multiple by itself is misleading because it ignores…',o:['the stock price','differences in growth, risk and capital structure across companies','earnings entirely','dividends only'],a:1,w:'A multiple is a compressed ratio of growth and risk; two companies at 25× can be worlds apart.'},
{q:'Earnings power value answers which question?',o:['what is the business worth assuming no future growth?','what will next year’s EPS be?','what is the stock’s beta?','how much debt can it carry?'],a:0,w:'EPV is the no-growth anchor: if the market price exceeds EPV, you are explicitly paying for future growth — name it.'}]}},

L10:{stage:'S3',code:'A-02',title:'Competitive Advantage — Moats & Industry Structure',hours:30,prereq:['L3'],
why:'Returns above the cost of capital attract competition like blood attracts sharks. Moat analysis is the study of why some firms keep their excess returns for decades — and most don’t.',
cap:'You can classify a company’s moat (or absence), evidence it with numbers, and estimate its durability.',
out:['Run a Porter five-forces analysis on any industry','Classify moats: scale, network effects, switching costs, brand, cost advantage, regulation','Evidence a moat with pricing-power and ROIC data','Apply Helmer’s 7 Powers and Greenwald’s entry barriers','Write a moat-erosion scenario for any company you own'],
concepts:[
{t:'Five forces',d:'Rivalry, entrants, substitutes, supplier power, buyer power — together they set industry profitability.'},
{t:'Moat taxonomy',d:'Durable advantages: scale economies, network effects, switching costs, brand/trust, regulated position, proprietary cost.'},
{t:'Pricing power as proof',d:'Raise prices without losing customers = moat. Buffett’s litmus test; numbers, not adjectives.'},
{t:'7 Powers',d:'Helmer’s toolkit: scaling economies, network, counter-positioning, switching costs, branding, cornered resource, process power.'},
{t:'Entry barriers',d:'Greenwald: the moat exists at the gate — supply advantage, demand advantage, economies of scale.'},
{t:'Moat decay',d:'Technology shifts, regulation and well-funded attackers erode advantages; every moat needs a decay estimate.'}],
models:['moat','inversion','scale'],
books:['b19','b21','b20','b23'],
res:['r1','r12'],
ex:[{t:'Moat audit ×3',d:'One Indian company per moat type you believe in. Evidence each with 10-year ROIC vs WACC, pricing history, churn/retention.'},{t:'Five forces your industry',d:'Full five-forces on the industry you’ll likely work in. Where does profit pool sit? Who captures it?'},{t:'Attack plan',d:'Choose a market leader. Write the competitor’s best attack: which force do they weaponise, and what does the incumbent do?'}],
cse:{title:'The erosion of the invincible',brief:'Kodak, Nokia, taxi medallions, encyclopaedias: each had a real moat. Identify the force that moved, how early it was visible, and why insiders couldn’t respond.'},
mist:['Calling brand a moat without pricing-power evidence','Assuming moats are permanent','Confusing a good industry with a good position inside it'],
gate:{q:[
{q:'The clearest quantitative evidence of a genuine moat is…',o:['high advertising spend','sustained pricing power — raising prices without proportional customer loss','many products','fast revenue growth'],a:1,w:'Pricing power is the moat made visible in the income statement.'},
{t:'',q:'A true network effect exists when…',o:['the company has many offices','value to each user rises as more users join','the CEO networks well','costs fall with volume'],a:1,w:'Scale alone is not network effects; the value itself must compound with participation.'},
{q:'Moats are best treated as…',o:['permanent features','decaying assets that require a durability estimate and a reinvestment story','accounting artifacts','legal guarantees'],a:1,w:'Every advantage has an attacker with a plan. The question is time: how long until the economics normalise?'}]}},

L11:{stage:'S3',code:'A-03',title:'Business Models & Unit Economics',hours:25,prereq:['L5','L3'],
why:'Different businesses are different physics. SaaS, marketplaces, manufacturing, banks and restaurants obey different equations — fluency in the models is what lets you compare them honestly.',
cap:'You can dissect the unit economics of the five major business archetypes and find the one number that kills each.',
out:['Compute CAC, LTV, payback, NRR, gross margin structures','Explain take rate, float and negative working capital','Compare capital-light vs capital-heavy return profiles','Map the model of a bank/NBFC (leverage, spread, credit risk)','Identify the fatal metric for each archetype'],
concepts:[
{t:'SaaS economics',d:'LTV/CAC, payback period, net revenue retention — retention is the whole religion.'},
{t:'Marketplace economics',d:'GMV vs take rate vs revenue; liquidity and network effects; who holds the float.'},
{t:'Manufacturing economics',d:'Fixed-cost absorption, capacity utilisation, capex cycles — utilisation is destiny.'},
{t:'Financial firm economics',d:'Spread × volume − credit losses, on a leveraged balance sheet; trust is the product.'},
{t:'Working capital superpowers',d:'Get paid before you pay (subscriptions, float, supplier terms) and growth generates cash instead of eating it.'},
{t:'Contribution margin discipline',d:'If the unit bleeds, scale is just a larger wound.'}],
models:['scale','base'],
books:['b27','b28','b8'],
res:['r8','r12'],
ex:[{t:'Autopsy of a unit',d:'Pick a food-delivery or ride-hailing order you made. Estimate the unit economics end to end: who made money on that order?'},{t:'SaaS teardown',d:'From any listed SaaS company’s filings: revenue retention proxy, CAC payback (if estimable), rule-of-40. Verdict.'},{t:'The float machine',d:'Explain how an insurer or prepaid platform earns on float. When does float become a liability instead of an asset?'}],
cse:{title:'Growth that destroys value',brief:'A company grows revenue 40%/yr while every unit sold loses contribution margin. Show the arithmetic by which scale accelerates destruction, and the metric that would have said stop.'},
mist:['Using GMV when revenue is the question','Trusting blended metrics that hide cohort decay','Applying SaaS logic to capital-heavy businesses'],
gate:{q:[
{q:'In a subscription business, the single most diagnostic metric is usually…',o:['total signups','net revenue retention — do existing customers expand or churn?','ad impressions','number of plans offered'],a:1,w:'NRR > 100% means the base compounds without new sales; below it, you’re bailing a leaking boat.'},
{q:'A business with negative working capital (customers pay before costs are due)…',o:['is necessarily failing','can fund growth with customer money — if sustainably structured','has too much inventory','cannot exist'],a:1,w:'Prepaid models turn growth into a cash source. But forced float can also be disguised stress — check sustainability.'},
{q:'If contribution margin per unit is negative, scaling volume…',o:['eventually fixes it','magnifies losses — scale cannot cure broken unit economics','improves brand','reduces CAC automatically'],a:1,w:'Negative units do not add up to a positive business; they add up faster.'}]}},

L12:{stage:'S3',code:'A-04',title:'Financial Modeling Lab I — Building the Machine',hours:35,prereq:['L5','L6'],
why:'A model is an argument expressed in arithmetic. Building one forces every hidden assumption into the open — and separates people who have opinions from people who can defend them.',
cap:'You can build a coherent 3-statement-lite forecast with scenarios and sensitivity, and you know exactly which rows drive the answer.',
out:['Articulate the three statements inside a forecast','Drive a model with explicit assumption drivers','Build scenario (base/bull/bear) and sensitivity tables','Compute break-even and operating leverage effects','Sanity-check any model with ratios and unit tests'],
concepts:[
{t:'Drivers, not cells',d:'Every line traces to an assumption: growth %, margin %, days, capex intensity. If a number has no driver, it’s a wish.'},
{t:'Statement articulation',d:'NI feeds retained earnings; capex feeds PP&E and investing cash flow; ΔWC lives in operating cash flow.'},
{t:'Scenarios',d:'Three coherent worlds, not ±10% noise: change the story and let the numbers follow.'},
{t:'Sensitivity',d:'Vary the two most dangerous inputs across a grid; find where the thesis dies.'},
{t:'Operating leverage',d:'Fixed costs make profits swing faster than revenue — in both directions.'},
{t:'Model hygiene',d:'No hard-coding in formula chains, unit checks, ratio sanity rows, documented assumptions tab.'}],
models:['inversion','prob'],
books:['b15','b18'],
res:['r2','r8'],
ex:[{t:'Three-year projector',d:'Use the Modeling Lab projector: revenue → EBITDA → NOPAT → FCF for one real company. Then break it: halve growth, double capex.'},{t:'Break-even war room',d:'For a hypothetical venture: fixed costs, price, variable cost → break-even volume and time. What utilisation is survivable?'},{t:'Sensitivity grid',d:'On your DCF from L9: grid WACC (±2%) × terminal growth (±1%). Report the value range and the kill condition.'}],
cse:{title:'The model that said no',brief:'A celebrated acquisition looked accretive “with synergies.” Rebuild the logic without synergy hopes, and show how one optimistic line can buy an empire of bad news.'},
mist:['Fitting the model to the desired answer','No scenario worse than a mild inconvenience','Circularity: using the output as an input'],
gate:{q:[
{q:'In a 3-statement model, net income flows into the balance sheet via…',o:['cash only','retained earnings (equity)','accounts payable','goodwill'],a:1,w:'Profit that is not distributed accumulates as equity — the articulation that keeps the sheets honest.'},
{q:'A firm with high fixed costs and rising revenue will typically see profits…',o:['grow slower than revenue','grow faster than revenue (positive operating leverage)','stay flat','fall'],a:1,w:'Once fixed costs are covered, each incremental rupee of revenue is mostly profit — until revenue reverses.'},
{q:'The main purpose of sensitivity analysis is to…',o:['impress with tables','identify which assumptions actually drive the outcome and where the thesis breaks','guarantee accuracy','replace judgment'],a:1,w:'You don’t model to be right; you model to know where you could be wrong.'}]}},

L13:{stage:'S4',code:'J-01',title:'Capital Allocation — The CEO’s Real Job',hours:30,prereq:['L5','L6','L9'],
why:'Every rupee a business generates faces exactly five exits: reinvest, acquire, dividend, buyback, or de-risk. The long-term owner return is almost entirely the story of those exits. This is the heart of the system.',
cap:'You can grade a management team’s capital allocation record and answer: “Where does the next rupee earn the highest risk-adjusted return?”',
out:['Evaluate reinvestment via incremental ROIC, not average ROIC','Judge buybacks by price vs intrinsic value, not by announcement','Assess dividend policy as information + discipline','Score M&A against base rates and per-share value tests','Reconstruct a management’s 10-year allocation record'],
concepts:[
{t:'The five exits',d:'Reinvest, acquire, dividend, buyback, repay debt/hold cash — every rupee takes exactly one.'},
{t:'Incremental ROIC',d:'What the *new* rupee earns, not the historical average. This is the scorecard of management.'},
{t:'Buyback arithmetic',d:'Value-creative only below intrinsic value; above it, wealth transfers from stayers to sellers.'},
{t:'Dividend logic',d:'Returning cash admits reinvestment returns are below hurdle — or signals confidence; context decides.'},
{t:'M&A base rates',d:'Most acquisitions fail to clear their cost of capital; premiums + integration + hubris explain why.'},
{t:'The Outsiders template',d:'Thorndike’s CEOs: extreme capital discipline, tax awareness, buyback opportunism, refusal of empire.'}],
models:['coc','oppcost','incentives'],
books:['b25','b26','b18'],
res:['r1','r2'],
ex:[{t:'Allocation autopsy',d:'One Indian conglomerate, 10 years: trace retained earnings into capex, M&A, dividends, buybacks. Compute value created per rupee retained (market value added per ₹).'},
{t:'Buyback trial',d:'Take two real buybacks at different price levels. Using the Modeling Lab drill, show which created and which destroyed per-share value.'},{t:'The next rupee memo',d:'You are CEO of a company with ₹500 crore surplus and a 14% WACC. Write the one-page allocation decision with alternatives ranked.'}],
cse:{title:'The diworsification machine',brief:'A profitable core funds acquisitions into glamour businesses at rich prices. Show how consolidated revenue grew while per-share value quietly decayed — and what the market took a decade to notice.'},
mist:['Judging buybacks by announcements instead of prices','Assuming “strategic” M&A deserves a pass from arithmetic','Ignoring the tax and compounding cost of dividends vs retention'],
gate:{q:[
{q:'A share buyback creates value for continuing shareholders only when…',o:['the stock price is rising','shares are repurchased below intrinsic value','EPS always rises','the CEO announces it confidently'],a:1,w:'Buybacks are an exchange: cash for equity. Overpay in that exchange and remaining owners are poorer, whatever EPS says.'},
{q:'The better scorecard for management’s allocation skill is…',o:['average historical ROIC','incremental ROIC on capital deployed during their tenure','revenue CAGR','number of acquisitions'],a:1,w:'The legacy base was inherited; the marginal rupees are the management’s own report card.'},
{q:'Diversifying retained earnings into businesses earning below the cost of capital is best described as…',o:['prudent balance sheet management','value destruction — better returned to shareholders who can allocate it themselves','synergy capture','strategic optionality'],a:1,w:'If the next rupee earns less inside than its cost, the owner-returning exit is the value-creating one.'}]}},

L14:{stage:'S4',code:'J-02',title:'Valuation II — Relative, Private & Special Situations',hours:35,prereq:['L9'],
why:'Not everything submits to a DCF. Relative valuation dominates deal practice; private markets price power and optionality; special situations price events. A complete valuer speaks all three dialects.',
cap:'You can run comparables, understand LBO and venture math, and know precisely when each method is trustworthy.',
out:['Build EV and use EV/EBITDA vs PE correctly','Run comparable-company sets and defend adjustments','Explain LBO return sources (growth, multiple, deleveraging)','Understand venture power-law and option-based pricing','Know Greenblatt’s special-situation categories'],
concepts:[
{t:'Enterprise value',d:'EV = equity + debt − cash: the price of the whole machine, independent of financing.'},
{t:'Comps discipline',d:'Choose peers by economics, not industry code; adjust for growth, margins, ROIC — or the multiple lies.'},
{t:'LBO mechanics',d:'Buy with leverage, pay debt from cash flows, exit — returns from operations, multiple, and financial engineering; risk concentrated in downside.'},
{t:'Venture math',d:'Power-law outcomes: a few winners must return the fund; valuation prices optionality, not cash flows.'},
{t:'Special situations',d:'Spinoffs, restructurings, post-bankruptcy equity, rights offerings — markets misprice events more than stories.'},
{t:'Precedent transactions',d:'What acquirers paid — including control premiums and synergy hopes. Reference, not gospel.'}],
models:['prob','ev','base'],
books:['b16','b49','b43','b44'],
res:['r2','r21'],
ex:[{t:'Comps table',d:'Five companies, one industry: EV, EBITDA, EV/EBITDA, growth, ROIC. Rank “cheapness” and defend adjustments in writing.'},{t:'LBO napkin',d:'Entry 8× EBITDA, exit 8×, EBITDA grows 50% over 5 years, debt paid from cash flow. Estimate equity multiple by napkin math; see why leverage amplifies both directions.'},{t:'Power-law sanity',d:'A VC fund of 20 deals: assume 12 go to zero, 7 return 1–2×, 1 returns 20×. Compute fund return. Understand why venture needs moonshots.'}],
cse:{title:'The spinoff nobody wanted',brief:'A conglomerate spins off an unglamorous unit; index funds dump it, analysts don’t cover it, insiders get options at low strikes. Explain why spinoffs are a structural hunting ground.'},
mist:['Applying public multiples to venture-stage companies','Treating precedent transaction prices as fair value','Forgetting that control premiums are paid for control, not wisdom'],
gate:{q:[
{q:'Enterprise value equals…',o:['market cap only','market cap + debt − cash','assets − liabilities','book value'],a:1,w:'EV is the takeover arithmetic: pay the equity holders, assume the debt, pocket the cash.'},
{q:'LBO equity returns come primarily from…',o:['insider tips','EBITDA growth, multiple expansion, and debt paydown — amplified by leverage','accounting changes','currency moves'],a:1,w:'The leverage turns operating and multiple gains into equity multiples — and losses into wipeouts.'},
{q:'Venture-stage valuations rely chiefly on judgment about optionality because…',o:['founders demand it','cash flows are negative and wildly uncertain, so DCF gives false precision','regulators require it','they are auctions'],a:1,w:'When the future is a distribution with fat right tails, you price the option, not the spreadsheet.'}]}},

L15:{stage:'S4',code:'J-03',title:'Risk, Probability & Decision Quality',hours:30,prereq:['L8','L4'],
why:'Judgment is applied probability. This level builds the machinery: expected value, base rates, Bayesian updating, position sizing — the difference between being right and being right-sized.',
cap:'You can frame any business decision as a probability distribution, size it sanely, and audit it for bias.',
out:['Compute expected value and variance for business bets','Apply base rates before stories','Update beliefs Bayes-style with new evidence','Explain Kelly logic and why practitioners bet less','Separate risk, uncertainty and optionality'],
concepts:[
{t:'Expected value thinking',d:'Decisions are bets: outcome × probability, summed. Judge decisions by EV, not by single outcomes.'},
{t:'Base rates',d:'Before your story, what usually happens? Most startups fail; most turnarounds fail; priors are load-bearing.'},
{t:'Bayesian updating',d:'New evidence shifts probabilities proportionally to its diagnostic power — not to its drama.'},
{t:'Kelly & sizing',d:'Optimal sizing balances edge and ruin; in practice, half or less, because your probabilities are soft.'},
{t:'Risk vs uncertainty',d:'Risk has known distributions; uncertainty doesn’t. Most business is the second — hence margins of safety.'},
{t:'Optionality',d:'Asymmetric payoffs: capped downside, open upside. Prefer convex exposure where you can afford it.'}],
models:['ev','base','prob','moat'],
books:['b11','b13','b29','b14','b41'],
res:['r16'],
ex:[{t:'EV gauntlet',d:'Price five hypothetical bets (expansion, lawsuit, product launch) as probability × outcome trees. Choose by EV, not by excitement.'},{t:'Base rate hunt',d:'For three ambitions (startup success, turnaround, M&A synergy capture), find the historical base rate and write it at the top of your analysis.'},{t:'Prediction ledger',d:'Make ten probabilistic forecasts about markets/companies. Score them later like Tetlock’s forecasters — calibration, not vibes.'}],
cse:{title:'Long-Term Capital Management',brief:'Nobel-grade models, tiny probabilities ignored, enormous leverage. Reconstruct how EV-positive positions still produce ruin when sizing ignores the tails.'},
mist:['Equating a good outcome with a good decision','Overweighting vivid recent evidence','Full-Kelly sizing on soft probabilities'],
gate:{q:[
{q:'A bet pays +₹200 with 50% probability and −₹100 with 50% probability. Its expected value is…',o:['+₹50','+₹100','₹0','−₹50'],a:0,w:'0.5×200 + 0.5×(−100) = +50. Repeatable positive EV is the whole game — and so is refusing negative EV.'},
{q:'Base-rate neglect means…',o:['using too many statistics','ignoring how often events of this kind have historically succeeded before weighing your story','betting on baseball','over-diversifying'],a:1,w:'Your case feels special; the distribution says otherwise. Anchor on the outside view, adjust with the inside.'},
{q:'Kelly-style sizing teaches practitioners to bet less than the theoretical optimum mainly because…',o:['brokers charge fees','probability estimates are uncertain and the cost of overbetting (ruin, volatility) is asymmetric and brutal','regulators require it','markets are closed'],a:1,w:'When your inputs are estimates, the penalty for overconfidence is ruin. Fractional sizing is humility with arithmetic.'}]}},

L16:{stage:'S4',code:'J-04',title:'Entrepreneurship — Building from Zero',hours:35,prereq:['L1','L3'],
why:'Building a business teaches what analysis never can: that the hard parts are finding a real problem, getting paid, and surviving long enough to learn. Founders who understand capital — and investors who understand building — dominate both sides.',
cap:'You can pressure-test any business idea to the point of evidence, design the cheapest experiment, and compute survival math.',
out:['Run problem interviews that don’t lie (Mom Test)','Define MVP as a learning device, not a launch','Compute runway, burn multiple and break-even','Choose distribution before product polish','Decide pivot/persevere/kill by evidence rules'],
concepts:[
{t:'Problem-first discipline',d:'Fall in love with the problem, never the solution. The market pays for pain, not effort.'},
{t:'Mom Test interviews',d:'Ask about their life and past behavior, never your idea; compliments are worthless, commitments are data.'},
{t:'MVP as experiment',d:'The smallest artifact that can falsify your riskiest assumption.'},
{t:'Runway arithmetic',d:'Runway = cash ÷ monthly burn. Survival is the precondition for every other strategy.'},
{t:'Distribution > product',d:'Most startups die of undistribution. The channel is the business.'},
{t:'Venture economics',d:'Dilution, liquidation preferences, ESOP pools — the finance layer that decides who actually owns the upside.'}],
models:['base','inversion','ev'],
books:['b33','b35','b32','b34'],
res:['r15'],
ex:[{t:'Five Mom Tests',d:'Interview five people about a problem you care about — zero pitching. Log quotes, commitments, and what surprised you.'},{t:'Runway dashboard',d:'Hypothetical venture: ₹1.2 crore raised, ₹9 lakh/month burn, ₹2 lakh MRR growing 15%/mo. Compute runway with and without revenue; find the break-even date.'},{t:'Idea gauntlet',d:'Run your best idea through the Idea Analyzer. Identify the most dangerous assumption and design the ₹10,000 experiment that tests it.'}],
cse:{title:'The pivot graveyard',brief:'Slack began as a failed game studio; Instagram shed features until one remained. Study two pivots: what evidence triggered the turn, and what stubborn-but-rational belief survived it?'},
mist:['Building before anyone has paid','Treating compliments as demand','Confusing activity (building) with progress (learning)'],
gate:{q:[
{q:'The Mom Test teaches that customer interviews should…',o:['pitch the idea and record enthusiasm','ask about the person’s life and past behavior, avoiding your idea until facts emerge','only survey close friends','focus on future promises'],a:1,w:'People lie to be nice about ideas and tell the truth about their own past behavior. Collect the truth.'},
{q:'The purpose of an MVP is to…',o:['launch fast and fix later','learn the most with the least effort by testing the riskiest assumption','impress investors','capture market share'],a:1,w:'An MVP is an experiment wearing product clothes. Its output is learning, not revenue — yet.'},
{q:'Runway is computed as…',o:['revenue ÷ costs','cash on hand ÷ monthly net burn','profit ÷ growth','valuation ÷ revenue'],a:1,w:'Before you are right, you must be alive. Runway is the countdown that makes every other decision real.'}]}},

L17:{stage:'S5',code:'P-01',title:'Company Deep-Dive Practicum',hours:40,prereq:['L5','L9','L10','L12'],
why:'Everything so far was training wheels. Here you perform the complete owner’s autopsy on a real listed company — annual report to decision — under professional standards.',
cap:'You can produce a full deep-dive on any listed company, including a defensible valuation and an explicit kill condition.',
out:['Navigate annual reports (MD&A, notes, segment data, related parties)','Reconstruct 5–10 year financial trajectory and allocation record','Evidence moat with data, not adjectives','Produce bull/base/bear cases with explicit probabilities','Write a one-page decision with kill criteria'],
concepts:[
{t:'Reading order that matters',d:'Auditor’s report and notes first, MD&A second, glossy pages last. The truth hides in footnotes.'},
{t:'Trajectory over snapshot',d:'Ten years of margins, ROIC, capex, dilution and pledges tell you the management’s character.'},
{t:'Indian governance tells',d:'Promoter pledges, related-party flows, auditor churn, ESOP generosity to self — know the local red flags.'},
{t:'Segment truth',d:'Conglomerate averages flatter; segments confess.'},
{t:'Decision discipline',d:'No analysis without a decision; no decision without a falsification test.'}],
models:['moat','inversion','mrmarket'],
books:['b5','b26','b39'],
res:['r4','r6','r7','r8','r5'],
ex:[{t:'The full autopsy',d:'Choose one Indian listed company. Complete the Company Lab framework end to end, using only primary filings. 10+ hours minimum.'},{t:'Footnote treasure hunt',d:'Find three disclosures in the notes that materially change the story versus the front pages. Document them.'},{t:'The opposition brief',d:'Write the strongest possible bear case against your own deep-dive. If you can’t, you don’t understand the company.'}],
cse:{title:'The coffee chain that wasn’t',brief:'India’s own Café Coffee Day tragedy: related-party complexity, debt off the listed perimeter, founder pressure. Reconstruct what the disclosures did and didn’t say, and when a careful reader should have left.'},
mist:['Anchoring on management commentary without cross-checking','Skipping the notes and auditor’s qualifications','Ending with “interesting company” instead of a decision'],
gate:{q:[
{q:'The sections of an annual report that usually carry the most truth are…',o:['the chairman’s glossy letter alone','notes to accounts, auditor’s report and MD&A specifics','the photo spreads','the awards page'],a:1,w:'Footnotes are where obligations live. If you only read the marketing pages, you only know the marketing.'},
{q:'In the Indian context, which combination is a governance red flag cluster?',o:['low debt + high cash','high promoter pledge + growing related-party transactions + frequent auditor changes','steady dividends','institutional ownership'],a:1,w:'None alone is fatal; together they describe insiders under pressure moving value around. That deserves a discount, at minimum.'},
{q:'A complete analysis must end with…',o:['more research','a decision plus the specific evidence that would reverse it','a valuation spreadsheet','a chart collection'],a:1,w:'Analysis without a decision is tourism. The kill condition is what separates a thesis from a mood.'}]}},

L18:{stage:'S5',code:'P-02',title:'Portfolio Construction & Asset Allocation',hours:25,prereq:['L7','L15'],
why:'Individual insight is worthless if the portfolio structure destroys it. This level builds the architecture: risk budgeting, diversification, costs, and the humility of index exposure alongside concentrated conviction.',
cap:'You can design and defend an asset allocation, explain concentration vs diversification honestly, and rebalance with discipline.',
out:['Distinguish systematic from idiosyncratic risk','Design an asset allocation for a given goal and horizon','Explain rebalancing as forced contrarianism','Quantify fee drag over decades','Articulate the concentration debate (Buffett vs Bogle) correctly'],
concepts:[
{t:'Risk decomposition',d:'Diversification kills company-specific risk; market risk stays and gets paid (or not).'},
{t:'Allocation drives outcomes',d:'Asset mix explains most of portfolio variability; security picking is marginal by comparison.'},
{t:'Rebalancing discipline',d:'Selling strength to buy weakness on a schedule — mechanical courage.'},
{t:'Cost compounding',d:'Fees compound negatively for decades; the cheapest adequate vehicle usually wins.'},
{t:'Concentration logic',d:'Concentrate only where knowledge advantage is genuine and ruin is affordable — otherwise index.'},
{t:'Drawdown psychology',d:'Design the portfolio for the worst night you will actually live through, not the average year.'}],
models:['base','prob','compounding'],
books:['b31','b30','b29','b41'],
res:['r9','r12'],
ex:[{t:'Allocation memo',d:'Design an allocation for: 25-year-old engineer, 10-year horizon, moderate risk, INR. Equity/debt/gold/cash split with one-paragraph defense each.'},{t:'Fee autopsy II',d:'₹10 lakh SIP ₹25k/month, 12% gross, 0.2% vs 1.5% cost, 25 years. Compute both endpoints and the difference in crores.'},{t:'Drawdown script',d:'Write in advance what you will do at −30% and −50% portfolio drawdowns. Date it. Your future self is the counterparty.'}],
cse:{title:'The diversification debate',brief:'Bogle: own the haystack. Buffett: diversification is protection against ignorance. Both are right — for different people. Define exactly which category you are in today and why.'},
mist:['Chasing recent winners into the allocation','Ignoring fees as “small”','Designing for average years and panicking in the bad one'],
gate:{q:[
{q:'Diversification primarily reduces…',o:['market-wide risk','company-specific (idiosyncratic) risk','fees','taxes'],a:1,w:'You can diversify away the single-company disaster; the market’s own swings stay, and that risk is the price of admission.'},
{q:'Rebalancing works as discipline because it forces you to…',o:['trade more often','systematically trim what has grown expensive and add to what is cheap relative to targets','follow momentum','reduce diversification'],a:1,w:'Rebalancing is contrarianism on rails — the rare rule that makes you do the hard thing automatically.'},
{q:'Over decades, the biggest structural advantage of low-cost index investing is…',o:['guaranteed alpha','keeping nearly the full market return instead of leaking it to fees','insider access','tax-free status'],a:1,w:'You cannot control returns; you can control costs. Compounding respects the difference enormously.'}]}},

L19:{stage:'S5',code:'P-03',title:'Strategy at the Top',hours:30,prereq:['L10','L13'],
why:'Strategy is the theory of how this firm wins against rivals who are also trying. This level moves from moat description to strategy construction: diagnosis, guiding policy, coherent action.',
cap:'You can critique any corporate strategy with Rumelt’s kernel, model competitive dynamics, and make build/buy/partner/exit calls.',
out:['Apply Rumelt’s kernel: diagnosis → policy → coherent actions','Model price competition and why copying destroys profits','Make vertical integration/outsourcing calls with transaction logic','Judge M&A logic beyond “strategic”','Explain disruption responses and platform dynamics'],
concepts:[
{t:'The kernel',d:'Good strategy = a diagnosis of the situation, a guiding policy, and coherent actions aimed at the crux. Ambitions are not strategy.'},
{t:'The crux',d:'The one hardest, most pivotal problem where effort concentrates. Strategy is choosing what NOT to do.'},
{t:'Imitation & game theory',d:'Any strategy your rivals can copy is an industry cost, not an advantage; model their response before moving.'},
{t:'Make vs buy',d:'Integrate when market transaction costs, hold-up risk or quality control exceed the bureaucracy cost of owning.'},
{t:'Disruption response',d:'Incumbents fail rationally: the disruptive market is too small to matter until it is big enough to kill.'},
{t:'Platform strategy',d:'Chicken-and-egg liquidity problems, subsidised sides, winner-take-most conditions.'}],
models:['moat','inversion','scale','second'],
books:['b22','b21','b20','b24','b47'],
res:['r1','r12'],
ex:[{t:'Kernel critique',d:'Take three published corporate “strategies” (annual letters/announcements). Grade each: real kernel or goal salad?'},{t:'War game',d:'Choose a duopoly (say, two Indian payment apps or airlines). Design one aggressive move; then write the rival’s forced response and the new equilibrium. Did anyone win?'},{t:'Build-buy-partner',d:'A capability gap in a company you follow. Score build vs buy vs partner on cost, speed, integration risk, and base rates. Decide.'}],
cse:{title:'The strategy that was a slogan',brief:'“We will be the Amazon of X” with no diagnosis, no crux, no coherent actions — and 12 unrelated initiatives. Autopsy why slogans die and what the diagnosis should have been.'},
mist:['Confusing ambition with strategy','Copying visible moves without understanding the position that makes them work','Acquiring because organic growth is hard'],
gate:{q:[
{q:'Per Rumelt, good strategy consists of…',o:['ambitious multi-year goals','a diagnosis, a guiding policy, and coherent actions aimed at the crux','vision and values statements','market share targets'],a:1,w:'Goals are wishes until a diagnosis explains the obstacle and the actions attack it coherently.'},
{q:'If every competitor can instantly copy a move, that move is…',o:['a sustainable advantage','table stakes — necessary but conferring no durable edge','a moat','impossible'],a:1,w:'Advantage must live where imitation is slow, costly or self-defeating. Otherwise you’ve raised the industry’s costs, including your own.'},
{q:'Vertical integration is justified primarily when…',o:['the company has spare cash','market transaction costs, hold-up risk or quality control problems exceed the cost of internal bureaucracy','the CEO wants control','competitors are doing it'],a:1,w:'Every integration trades market flexibility for coordination. The math, not the mood, decides.'}]}},

L20:{stage:'S5',code:'P-05',title:'Organizations, Leadership & Governance',hours:25,prereq:['L8','L13'],
why:'Companies are human systems wearing financial costumes. Capital allocation decisions are made by people with incentives, egos and blind spots — owners must read organizations as fluently as statements.',
cap:'You can audit a company’s incentive structure, spot agency problems, and evaluate leadership quality from observable evidence.',
